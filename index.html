rs; Adobe Firefly or Canva Business for brand-grade images.","advice":"Make this the default 'safe place' for everyone from day one. Ask IT to confirm Copilot Chat is on for your licences, that the shield shows for every user, to switch on audit and retention in Purview, and to add a DLP rule (card numbers plus keywords like 'dövriyyə', 'оборот', 'turnover'). The paid add-on can find every file a person has access to, so fix open SharePoint folders first.","confidentiality":"Microsoft processes data as a processor under its Data Protection Addendum, the same terms as Exchange email and SharePoint. Prompts, answers and company files are NOT used to train models (Microsoft Learn, updated 18 Aug 2026). Chats are logged in your own Microsoft 365, kept under YOUR retention policy, and searchable in Purview/eDiscovery; uploaded files stored in your OneDrive. ISO/IEC 27018, GDPR support; the Customer Copyright Commitment covers output claims. Exceptions: web queries sent to Bing have user and tenant IDs removed but fall under Bing's terms and outside the EU Data Boundary; Anthropic models inside Copilot are also outside the EU Data Boundary. Data region follows your tenant (ask IT). A personal Microsoft account does NOT get this protection.","sources":["https://learn.microsoft.com/en-us/copilot/microsoft-365/enterprise-data-protection","https://learn.microsoft.com/en-us/copilot/privacy-and-protections","https://www.microsoft.com/en-us/microsoft-365-copilot/business","https://support.microsoft.com/topic/cfff4791-694a-4d90-9c9c-1eb3fb28e842","https://mc.merill.net/message/MC1181998","https://www.computerworld.com/article/4093224/"],"library_id":"","section":"models","id":"microsoft-copilot-chat-work-account-green-shield"},{"name":"ChatGPT Business (not Free or Plus)","url":"https://chatgpt.com/business/","category":"Chat assistant, team plan","what":"OpenAI's team plan for ChatGPT: Projects, Custom GPTs, image generation and editing (GPT Image 2.5), apps such as Canva, and agent mode for multi-step tasks.","for_you":"The tool most staff already know, now with a company workspace. Strong for AZ/RU/EN captions, ad variants, visuals and quick ideas. The catch: no data residency on Business, logo or engraving accuracy is unproven, and OpenAI's own pages blocked our reader.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Business data not used for training by default. Personal Free/Plus train unless switched off.","effort":"20–30 min to start","price":"$20–25/user/mo","plan_and_price":"About $20/user/month billed annually or $25 monthly, minimum 2 users, after a 2 Apr 2026 price cut (secondary sources citing OpenAI). Premium seat $100/$125. Enterprise: contact sales.","readings":[{"value":"Off by default","label":"training on Business data"},{"value":"0 images","label":"we could generate in our test (needs a paid account)"},{"value":"2","label":"minimum users"}],"try_before_friday":"Write a brief for a made-up 'New Year gift guide: 5 items' and ask for captions in AZ, RU and EN in a fixed tone. Then upload one public product photo from the website and ask for a festive background; zoom in on logos and hallmarks. Optionally build a Custom GPT 'Italdizain captions' from public website text and 5 public posts.","good_for":["Captions and product texts in AZ/RU/EN","Ad copy variants for A/B tests","Custom GPTs with a brand-voice guide; Canva app inside chat"],"not_for":["Final packshots of engraved or logo-heavy items without human checking","Personal Plus accounts for company work","Anything needing an EU-only data guarantee"],"better":"Claude Team for long-form RU/EN copy; Copilot to stay inside Microsoft.","advice":"Choose ONE paid team plan (ChatGPT or Claude) after the Friday comparison; paying for both doubles the cost and splits the prompt library. A person checks every product detail in an AI image.","confidentiality":"OpenAI says Business, Enterprise, Edu and API data is not used for training by default, including data in apps and agent mode (via search snippets and secondary sources; OpenAI's pages blocked our reader). Encryption AES-256 at rest, TLS 1.2+; DPA offered; SOC 2 Type 2 and ISO 27001/27017/27018/27701 listed on OpenAI's page. Data residency (EU and others) is offered to Enterprise, Edu and API, not Business by name. Retention details for Business not confirmed on an official page; a secondary source says deleted chats leave OpenAI's systems within 30 days. Free and Plus: training on unless switched off.","sources":["https://openai.com/business-data/","https://openai.com/enterprise-privacy/ (via snippet)","https://openai.com/index/expanding-data-residency-access-to-business-customers-worldwide/","https://lenz.io/c/openai-chatgpt-business-5-dollar-price-cut-2026-72b95dee","https://krater.ai/blog/chatgpt-team-pricing","Library test e10b19f590 (GPT Image 2.5, 12 Oct 2026)"],"library_id":"e10b19f590","lib_note":"GPT Image 2.5 tested by us 12 Oct 2026","section":"models","id":"chatgpt-business-not-free-or-plus"},{"name":"Claude Team (not Free, Pro or Max)","url":"https://claude.com/pricing","category":"Chat assistant, team plan","what":"Anthropic's Claude for teams. It writes and edits long copy in brand voice, drafts briefs, and makes quick slide decks. Projects hold your brand guide; Skills store repeatable instructions; connectors link Microsoft 365, Canva and Meta Ads.","for_you":"A careful writer and editor: in our test it drafted a 6-slide deck in 85 seconds and left unknown numbers blank instead of inventing them. The catch: no image generation, no EU-only storage, and Azerbaijani is untested.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"No training on Team content by default. Personal plans train only if the user allows it.","effort":"15–30 min to start","price":"$20–25/seat/mo","plan_and_price":"Team Standard $20/seat/month annual or $25 monthly; Premium $100/$125 (5x usage, adds Claude Code and Cowork). 2 to 150 seats. Enter ude.com/en/articles/7996868-is-my-data-used-for-model-training","https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data","https://support.anthropic.com/en/articles/10015870-what-certifications-has-anthropic-obtained","https://www.anthropic.com/news/updates-to-our-consumer-terms","https://www.resultsense.com/news/2026-08-21-anthropic-enterprise-data-retention/","Library test 9a30aef757 (Claude Slides, 12 Oct 2026)"],"library_id":"9a30aef757","lib_note":"Tested by us 12 Oct 2026 (Claude Slides)","section":"models","id":"claude-team-not-free-pro-or-max"},{"name":"Choosing the model per job (Claude, GPT, Gemini, open-weight)","url":"https://benchlm.ai/compare/claude-fable-5-1-vs-gpt-6-astra","category":"Model choice","what":"A simple map of which AI model to use for which marketing job, and what each costs, so the team doesn't overpay or use the wrong model.","for_you":"Everyday copy: Claude Sonnet 5.5 or GPT-6.1 Sol. Hard strategy: Claude Fable 5.1 or GPT-6 Astra. Bulk tagging: Gemini 3.8 Flash. The catch: nobody has published Azerbaijani scores, so your own test decides.","verdict":"Try now","verdict_detail":"","safe_level":"amber","safe_line":"The plan matters more than the model: business terms apply only inside business plans.","effort":"30 min","price":"Included in chat plans","plan_and_price":"In chat plans: included. API per million tokens (input/output): Claude Sonnet 5.5 $2/$10, Opus 5.5 $4/$20, Fable 5.1 $10/$50; GPT-6.1 Sol $2/$10; GPT-6 Astra about $10/$50 (unverified tracker); Gemini 3.8 Flash $0.75/$3.75 (intro price, said to double 1 Jan 2027).","readings":[{"value":"$0.43 vs $1.94","label":"Sonnet 5.5 vs Opus 5.5 on our made-up report test, both all correct"},{"value":"82.6 vs 81.9","label":"Fable 5.1 vs GPT-6 Astra on BenchLM (overlapping ranges)"},{"value":"Not found","label":"published Azerbaijani scores for any big model"}],"try_before_friday":"Take one public product (e.g. a vase from the website). Run the same s.","for_you":"In our test it answered every checkable question as well as the pricier Opus, for about a quarter of the cost, and wrote a correct Russian summary. The catch: slow on big jobs (about 3 minutes).","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Not trained on via Team/Enterprise/API; personal plans only if 'Help improve Claude' is on.","effort":"0 min to switch","price":"In Claude plans; API $2/$10 per M tokens","plan_and_price":"API $2 input / $10 output per million tokens; included in Claude subscriptions within plan limits.","readings":[{"value":"$0.43 vs $1.94","label":"cost of the same job on Sonnet versus Opus"},{"value":"5 of 5","label":"checked answers right, same as Opus"},{"value":"3 min","label":"to read a 30 KB report and sales table"}],"try_before_friday":"Give Claude an invented boutique sales table and a short brief. Ask for a 3-sentence Russian summary and a week of English captions, then check every figure by hand.","good_for":["Daily drafting, summaries and Russian-language text","Cross-checking a report against raw data"],"not_for":["Instant answers on big jobs","Adding up hundreds of rows without a spreadsheet check"],"better":"Opus 5.5 only for long or hard jobs; on routine work it showed no gain.","advice":"Make it the default model for routine marketing work, on a company account. Azerbaijani was not tested, so a person still checks Azerbaijani copy.","confidentiality":"Text goes to Anthropic. On Claude Team, Enterprise or the API it is not used for training by default (30-day standard retention; zero retention available on API). On personal Free, Pro or Max accounts it is used only if 'Help improve Claude' is on (page updated 16 Mar 2026), and then kept up to 5 years.","sources":["https://itdaily.com/news/software/claude-sonnet-5-5/","https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training","https://docs.claude.com/en/docs/claude-code/data-usage","Library test dbe4e4319d"],"li
