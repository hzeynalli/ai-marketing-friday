 .card{scroll-margin-top:12px}}

<script>
const PACK = {"title":"AI in our marketing — what to try before Friday","meeting":"Friday 16 Oct 2026","date":"2026-10-13","by":"Claude on MacBook Air, for Huseyn Zeynalli","intro":["Why: AI can already take hours off captions, product texts, ad variants, reports and site fixes. Huseyn wants the team to use it a lot, and your worry about turnover, customer and supplier data is fair. This page answers both.","The short version: the risk depends on which account you use, not on whether you use AI. Business plans do not train on your data; personal and free accounts can.","How to use it: read 'Keep it safe first', then open your role's checklist at the bottom. Each card has a '+' with a 10–30 minute exercise. Use only public or made-up data in every exercise.","Filters at the top narrow the list by section, safety light and verdict; the search box finds any tool. Hover the dotted words for a plain explanation.","Bring to Friday: your scores from 3–5 exercises, the tasks you would hand to AI first, the data you are still worried about, and a yes / not yet / no on switching your workflow."],"sections":[{"id":"safe","title":"Keep it safe first","short":"Safety","summary":"The confidentiality risk comes from which account people use, not from AI itself. Free and personal accounts (ChatGPT Free/Plus, Claude Free/Pro, Gemini on a personal Gmail) may use chats for training, and some are read by reviewers. Business plans say in their contracts that they do not. Italdizain already pays for Microsoft 365, so Copilot Chat with the work account is the first safe tool. For truly secret material, run a model on your own computer or swap real names and numbers for placeholders. Customer data stays RED because Azerbaijan's personal-data law generally requires written consent to pass data abroad, and every AI cloud is abroad.","count":8},{"id":"content","title":"Content creation","short":"Content","summary":"Content work almost never needs turnover or customer lists, so those never go into a content tool. Product photos already on italdizain.az and Instagram are public and low-risk. Green tools: Canva Business and Adobe Firefly (plus the chat plans in the models section). Amber: Photoroom (switch training off), Claid, Google Gemini/Flow on personal accounts, Runway. Red: Midjourney (public by default), Kling (training and commercial-use limits), CapCut (perpetual licence over uploads). For a luxury brand, every AI product image is compared with the real item before it goes out.","count":10},{"id":"seo","title":"SEO, website and AI search","short":"SEO & web","summary":"Most SEO and AI-search work runs on public information, so it is low risk. A public check of italdizain.az on 13 Oct 2026 found GA4, Yandex Metrica and the Meta Pixel; robots.txt blocks no AI bots; sitemap.xml redirects to the homepage (no working sitemap); the English homepage has no structured data, no language tags linking AZ/RU/EN and no main H1. Google says there is no special trick for its AI answers: good normal SEO is enough. Start with the free AI in Search Console, GA4 and Bing, then pick one paid suite (Semrush) and one AI-visibility tracker (Otterly).","count":10},{"id":"ads","title":"Advertising","short":"Ads","summary":"Start with the AI already inside Meta Ads Manager and Google Ads: your ad data already sits there, so no new company is involved. Risk appears when someone pastes an ad report into a personal AI plan, connects an outside tool to the ad account, or shares conversion value and ROAS (which reveal turnover). Meta (open beta since 29 Apr 2026) and Google now have official connectors for Claude and ChatGPT: start read-only. Google's ad-writing AI is English-first and does not write Azerbaijani or Russian. Every AI-changed image of a watch or jewel is checked by a person.","count":10},{"id":"social","title":"Social media and clients","short":"Social & clients","summary":"Big social suites now send your text to OpenAI, Anthropic, Microsoft or Google under contracts that forbid training, but Sprout's and Hootsuite's terms let the vendor itself use your AI inputs to improve its own AI. Meta's free Business Agent for WhatsApp and Instagram is visible to Meta and may be used to improve Meta's AI, so it only ever learns public information. Buffer, Metricool and respond.io publish no clear AI-training statement: ask them three questions in writing (which AI provider, do you or they train on our content, where is it stored). A social tool may see what is already public and post drafts, never turnover, client lists or VIP notes. Azerbaijani support is unverified for every tool here.","count":10},{"id":"auto","title":"Automation and connecting it all","short":"Automation","summary":"Automations decide where data flows without anyone watching, so pick the setup before building. n8n on our own server keeps data in-house; Zapier or Make are quicker but run in their cloud; Power Automate stays inside the Microsoft contract. AI steps should use business APIs (not trained on by default; zero retention by agreement). Every automation that publishes anything has a human approval step.","count":5},{"id":"models","title":"AI models and chat interfaces","short":"Models & chat","summary":"Start with Copilot Chat (already paid for, same contract as Outlook, no training). Then buy ONE writing plan, Claude Team or ChatGPT Business (about $20–25 per user per month), after the team's own Azerbaijani test. Business plans do not train on company data; personal accounts can, so personal accounts are banned for work. Local models keep secret text on the laptop but are clearly weaker. Nobody has published Azerbaijani quality scores for the big models.","count":6},{"id":"library","title":"From our own library","short":"Our library","summary":"Items from Huseyn's AI Instruments library (2,194 cards, about 600 with test results) that fit the marketing team and did not already appear above. Most are free add-ons that run on the team's own Mac. Tests used made-up data. Library items elsewhere on this page carry a 'library' chip too. Every item that came from the library is listed in the app's Briefs page as 'marketing-friday-2026-10'.","count":8}],"traffic":[{"light":"green","what":"Public product information, brand stories, website text, published product photos","where":"Any approved AI tool","example":"'Write 3 captions for this vase from our website.'"},{"light":"green","what":"Draft posts and captions, campaign ideas, translations of public text, made-up examples","where":"Any approved AI tool","example":"'Ideas for an autumn tableware week.'"},{"light":"amber","what":"Unreleased campaigns, launch dates, internal plans, unreleased product photos","where":"Company business accounts only (Copilot Chat with green shield, ChatGPT Business, Claude Team); images only in Firefly or Canva Business","example":"'Plan the December launch of the new collection.'"},{"light":"amber","what":"Supplier names; turnover totals or growth with no names attached; ad results with revenue columns removed","where":"Company business accounts only","example":"'Instagram sales up 12% this quarter: what worked?'"},{"light":"red","what":"Customer names, phones, emails, purchase histories, VIP lists","where":"Never in a cloud AI. Local model, or anonymise first and keep the key on your PC","example":"'Aygün M., +994 50…, bought a 24-piece set'"},{"light":"red","what":"Exact turnover and margins per boutique or brand; 1C exports","where":"Never in a cloud AI. Local model (LM Studio) only","example":"'September sales by boutique from 1C'"},{"light":"red","what":"Supplier prices, purchase prices, contracts with prices","where":"Never in a cloud AI","example":"'Our purchase price list from the Italian supplier'"},{"light":"red","what":"Staff data, passport or ID scans, passwords and API keys","where":"Never in any AI tool","example":"'The Meta Ads login is…'"}],"plans":[{"tool":"Microsoft Copilot Chat","safe_plan":"Work account (green shield)","trains_safe":"No","risky_plan":"Personal Microsoft account","trains_risky":"No company protection"},{"tool":"ChatGPT","safe_plan":"Business / Enterprise","trains_safe":"No (off by default)","risky_plan":"Free / Go / Plus / Pro","trains_risky":"Yes, unless switched off"},{"tool":"Claude","safe_plan":"Team / Enterprise / API","trains_safe":"No (feedback chats aside)","risky_plan":"Free / Pro / Max","trains_risky":"Only if 'Help improve Claude' is on (kept 5 years)"},{"tool":"Google Gemini","safe_plan":"Workspace (we don't have it)","trains_safe":"No","risky_plan":"Personal Gmail","trains_risky":"Yes with Keep Activity on; human review"},{"tool":"Canva","safe_plan":"Teams / Business / Enterprise","trains_safe":"Never (cannot be switched on)","risky_plan":"Free / Pro","trains_risky":"On by default"},{"tool":"Adobe Firefly","safe_plan":"Any plan","trains_safe":"Never on user content","risky_plan":"Partner models inside Firefly","trains_risky":"Adobe says no; not covered by indemnity"},{"tool":"Photoroom","safe_plan":"Enterprise","trains_safe":"No unless agreed","risky_plan":"Self-serve app/API","trains_risky":"On by default, opt-out"},{"tool":"Runway / Higgsfield","safe_plan":"Enterprise contract","trains_safe":"No","risky_plan":"Self-serve","trains_risky":"Yes"},{"tool":"Midjourney / Kling / CapCut","safe_plan":"None suitable","trains_safe":"—","risky_plan":"All plans","trains_risky":"Public by default / trains / perpetual licence"},{"tool":"Zapier","safe_plan":"Enterprise","trains_safe":"Opted out automatically","risky_plan":"Free / Pro / Team","trains_risky":"Opt-out available"},{"tool":"Semrush","safe_plan":"All plans","trains_safe":"No (AI terms)","risky_plan":"—","trains_risky":"—"},{"tool":"Sprout Social / Hootsuite","safe_plan":"Paid plans","trains_safe":"AI providers no; vendor itself may","risky_plan":"—","trains_risky":"—"},{"tool":"DeepSeek (hosted)","safe_plan":"None","trains_safe":"—","risky_plan":"App and website","trains_risky":"Yes; data stored in China"}],"models_table":[{"name":"Microsoft Copilot Chat","plan":"Included with Microsoft 365 (work login)","price":"$0 extra","trains":"No","trains_level":"green","lang":"Azerbaijani caption quality unproven; test it."},{"name":"Microsoft 365 Copilot Business add-on","plan":"Add-on, up to 300 users","price":"$18 promo / $21 list / $25.20 monthly","trains":"No","trains_level":"green","lang":"Same models as Copilot Chat; reads your mail and files."},{"name":"ChatGPT Business","plan":"Team workspace, min. 2 users","price":"$20 annual / $25 monthly","trains":"No (off by default)","trains_level":"green","lang":"No published Azerbaijani data; test it."},{"name":"Claude Team","plan":"2–150 seats","price":"$20 annual / $25 monthly","trains":"No by default","trains_level":"green","lang":"Correct Russian summary in our Sonnet 5.5 test; Azerbaijani untested."},{"name":"Perplexity Enterprise Pro","plan":"Per seat","price":"~$34–40 (secondary sources)","trains":"No, by contract (secondary sources)","trains_level":"amber","lang":"Not tested; research tool, not a writer."},{"name":"Gemini on personal Gmail","plan":"Consumer / Google AI Pro","price":"Free / ~$19.99","trains":"Yes with Keep Activity on","trains_level":"red","lang":"Not tested by us."},{"name":"ChatGPT / Claude personal (Free, Plus, Pro, Max)","plan":"Personal","price":"Free–$20+","trains":"Yes unless switched off / if allowed","trains_level":"red","lang":"Same models; not for company work."},{"name":"DeepSeek (hosted app)","plan":"Free","price":"Free","trains":"Yes; data in China","trains_level":"red","lang":"Not tested; do not use for company data."},{"name":"Local model (LM Studio / Ollama, Gemma or Qwen)","plan":"On your own computer or server","price":"Free","trains":"No (nothing leaves the machine)","trains_level":"green","lang":"Tiny model in our test: Azerbaijani 3 of 5, Russian 7 of 9 right. Weaker than cloud."}],"roles":[{"role":"SMM (Instagram, Facebook, TikTok)","tools":["Microsoft Copilot Chat (work account, green shield)","Canva Business (Magic Studio)","Metricool","Meta Business Agent (WhatsApp Business, Instagram, Messenger)","Instagram Agent Skill"],"questions":["Which of my weekly tasks did AI do at least as well, and how many minutes did it save?","How good was the Azerbaijani (score 1–5) and the Russian?","Would I trust an AI reply in client DMs, and for which questions?","Which of my current apps (CapCut, personal ChatGPT) should I stop using for brand work?"]},{"role":"Website and SEO","tools":["Google Search Console AI setup + GA4 Analytics Advisor","Bing Webmaster Tools – AI Performance report","Otterly.AI","Screaming Frog SEO Spider with AI prompts","Product descriptions at scale, with a claims check"],"questions":["What does AI currently say about Italdizain when asked 'where to buy X in Baku'?","Which 5 fixes (sitemap, H1, language tags, alt text) should the contractor do first?","Can AI draft our product texts in three languages to a quality we would publish after one edit?","Semrush or Ahrefs: which one, or neither yet?"]},{"role":"Advertising","tools":["Meta Advantage+ creative and Ads Creative Studio","Meta AI business assistant (in Ads Manager)","Google Ads AI: AI Max, Performance Max assets, Asset Studio and Ask Advisor","Meta Ads AI Connectors (official link from Claude or ChatGPT to Meta ads)","Pencil (AI ad generator by Brandtech)"],"questions":["Which Advantage+ switches changed our products or logos, and which are safe to leave on?","Was the assistant's advice right when checked against the numbers?","Do we want a read-only AI weekly report, and who owns it?","Which ad data must never leave Meta or Google (revenue, customer lists)?"]},{"role":"Content and design","tools":["Adobe Firefly (with Express, Photoshop and Firefly Boards)","Canva Business (Magic Studio)","Photoroom","ChatGPT Business (not Free or Plus)","Photoroom Fidelity Layer (the 'check against the original' rule)","CapCut"],"questions":["How many AI product images came back fully intact (logo, engraving, colour)?","Firefly, Canva or both: which fits our brand work?","Where should the 'compare with the original' check sit in our process?","Which CapCut projects should move to Adobe Express or Canva?"]},{"role":"Team lead","tools":["Green / amber / red paste rules + one-page AI policy","Free and personal AI apps, and hosted DeepSeek (what to avoid)","Azerbaijan Law on Personal Data + GDPR basics","Choosing the model per job (Claude, GPT, Gemini, open-weight)","Microsoft Purview DLP for Edge and Copilot"],"questions":["Where did the team disagree when sorting data into green, amber and red?","Which AI apps and accounts are people already using?","Claude Team or ChatGPT Business: which one, for how many seats?","What do we ask IT (Copilot on, Purview, Intune) and a lawyer (consent, localisation)?","Who owns the brand-voice assistant and the paste rules?"]}],"questions":["Which 3 tasks do we hand to AI first, and who owns each one?","Do we adopt the green/amber/red paste rules as written, and who checks a sample of chats each month?","Copilot Chat for everyone from Monday: is it switched on for all our licences, and does everyone see the green shield?","Which ONE writing plan do we buy (Claude Team or ChatGPT Business), for how many seats, based on our Azerbaijani scores?","Canva Business, Adobe Firefly, or both for design and product images?","Do we ban personal and free AI accounts (and CapCut, Midjourney, Kling) for brand and company work?","What is our rule for AI product images: who compares each one with the real item before it is published?","Do we connect AI to Meta and Google ads read-only, and who is the one named person?","Do we test Meta's Business Agent on a spare WhatsApp number, or keep client chats human-only for now?","What do we ask IT (Purview, Intune) and a Baku lawyer (customer consent, data localisation) before going further?"],"left_out":[{"name":"Higgsfield","verdict":"Worth a look later","reason":"Trains on content unless Enterprise; video not yet a confirmed priority."},{"name":"Agorapulse","verdict":"Worth a look later","reason":"Does not publish its AI provider or training position; Sprout and Metricool cover the need."},{"name":"Hootsuite","verdict":"Worth a look later","reason":"Merged into the Sprout Social card as the close rival."},{"name":"AdCreative.ai","verdict":"Try for X only","reason":"No security page or privacy policy found on its homepage; mentioned under Pencil."},{"name":"Birch (formerly Revealbot)","verdict":"Worth a look later","reason":"Meta's free automated rules cover most needs; no certificates named."},{"name":"Madgicx","verdict":"Skip","reason":"Privacy policy from Jan 2023, hidden prices; mentioned under Ryze."},{"name":"Smartly","verdict":"Skip","reason":"Enterprise budgets (~€5K/mo); its security page is cited as a yardstick under Brandwatch."},{"name":"Surfer","verdict":"Worth a look later","reason":"Azerbaijani support and training position unknown."},{"name":"Profound","verdict":"Worth a look later","reason":"Enterprise price (est. $2,000–5,000/mo); mentioned under Otterly."},{"name":"Limina PrivateGPT","verdict":"Try for X only","reason":"No public price; Azerbaijani unconfirmed; paste rules plus Purview come first."},{"name":"Synthesia, HeyGen","verdict":"—","reason":"Avatar video judged a doubtful fit for a luxury brand."},{"name":"Pebblely","verdict":"—","reason":"Training answer hidden on its page; not ranked."},{"name":"Mistral Le Chat Team","verdict":"—","reason":"$24.99/user; training row unlabelled on its page."},{"name":"Library runners-up","verdict":"—","reason":"RampStack seo-onpage (7414b3aa5b), No AI Slop (63a2e52acc), marketingskills (e9cf7f6954), HY-MT1.5 (eb80bd694c), OpenEdit (9e991fe621), BrightBean Studio (f2bf0fc315), Open WebUI (b3fa190c2e), Archestra (05a580b436), Tulip (c77953d765), DeskcommCRM (de6816a5ac, unofficial WhatsApp bridge: ban risk)."}],"not_verified":["OpenAI's own pricing and privacy pages blocked automated reading: ChatGPT Business price, retention and residency come from search snippets and secondary sources.","Canva's and Midjourney's pages blocked reading: Canva Business price (~$25) and Midjourney terms come from search snippets or third-party guides.","Azerbaijani quality was not verified for any tool or model; no vendor publishes it.","Meta has not published whether uploaded ad creative, Business Agent chats or connector data train its AI, or how long connector data is kept.","TikTok Symphony's advertiser terms on training, and its price, were not confirmed on a TikTok page.","Microsoft Copilot Business availability and price for Azerbaijan; Purview coverage on Business Premium.","Azerbaijan data-localisation claim (one law firm only) and whether customer consent covers foreign AI processing: needs a Baku lawyer.","Gemini Enterprise prices (official page returned 404); Perplexity Enterprise terms (official page not readable).","Adobe IP indemnity scope for partner models comes from a community expert, not Adobe.","Several library items were read but not hands-on tested: Firefly Boards technique, Photoroom cards, n8n-MCP, macshot, rizzo-pii, Google Ads Asset Studio (needs a live account)."],"glossary":{"DPA":"Data Processing Agreement: the contract that says a vendor only processes your data on your instructions.","SOC 2":"An independent audit of a vendor's security controls. 'Type II' means they were checked over several months.","ISO 27001":"International certificate for running information security properly.","GDPR":"The EU's personal-data law. It applies to us when we sell to or track people in the EU.","MCP":"Model Context Protocol: a standard plug that lets an AI chat read (and sometimes change) another app's data.","SSO":"Single sign-on: staff log in with their company Microsoft account, and access ends when they leave.","API":"A machine-to-machine connection. Automations use it instead of the chat window; terms differ from consumer apps.","opt-out":"Training or sharing is ON unless you find the setting and switch it off.","Opt-out":"Training or sharing is ON unless you find the setting and switch it off.","data residency":"Choosing the country or region where your data is stored.","IP indemnity":"The vendor promises to defend you if someone claims the AI output copies their work.","indemnity":"The vendor promises to defend you if someone claims the AI output copies their work.","sub-processor":"Another company the vendor passes your data to, such as its cloud host or AI provider.","SEO":"Search engine optimisation: making pages easy for Google and Bing to find and show.","alt text":"A short text description of an image, read by search engines and screen readers.","meta description":"The short text shown under a page title in Google results.","structured data":"Hidden labels in a page's code that tell Google what the page is about (product, store, price).","sitemap":"A file listing every page of the website for search engines.","robots.txt":"A file that tells search engines and AI bots which pages they may read.","H1":"The main headline of a web page; search engines use it to understand the topic.","ROAS":"Return on ad spend: revenue per manat spent on ads. It reveals turnover, so treat it as amber/red.","conversion value":"The sales value Meta or Google attribute to an ad. It reveals turnover.","Performance Max":"A Google Ads campaign type where Google's AI picks channels, images and text for you.","Advantage+":"Meta's set of AI switches that change targeting and creative automatically.","SynthID":"Google's invisible watermark marking an image or video as AI-made.","local model":"An AI model that runs on your own computer or server, so text never leaves it.","open-weight":"A model whose files are published, so you can run it on your own machine.","Purview":"Microsoft 365's data-protection console: labels, retention and blocking rules.","DLP":"Data loss prevention: rules that spot sensitive data and block it from leaving.","Intune":"Microsoft's tool for managing company computers centrally. Purview browser blocking needs it.","zero data retention":"The AI provider agrees to keep nothing after answering.","EU Data Boundary":"Microsoft's promise to keep EU customers' data processed inside the EU.","1C":"Italdizain's accounting and sales system. Its exports are RED data.","packshot":"A clean product photo, usually on white, as used in catalogues.","clienteling":"Personal, one-to-one follow-up of known clients by boutique advisors.","heatmap":"A colour map of where visitors click or scroll on a page.","GA4":"Google Analytics 4, the website statistics tool italdizain.az already runs.","Search Console":"Google's free tool showing which searches bring people to your site.","AI Overviews":"The AI-written answer Google shows above normal search results.","grounding queries":"The searches an AI assistant ran to find pages before answering.","Stealth Mode":"Midjourney's paid option that hides your images from the public gallery (best efforts).","Content Credentials":"A label embedded in an image showing it was made or edited with AI.","green shield":"The 'protected' icon in Copilot Chat that shows company data protection is on.","retention":"How long a vendor keeps your chats or files before deleting them."},"counts":{"safe":8,"content":10,"seo":10,"ads":10,"social":10,"auto":5,"models":6,"library":8},"items":[{"name":"Green / amber / red paste rules + one-page AI policy","url":"https://www.michalsons.com/focus-areas/artificial-intelligence-law/free-generative-ai-acceptable-use-policy","category":"Company AI rules","what":"A two-page company rule saying which AI tools are approved and what data may go into each one, adapted from a free template.","for_you":"This answers the team's confidentiality fear with clear rules rather than a ban. The catch: rules only work if they are short, everyone is trained, and someone checks a sample of chats now and then.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"A document, not a tool: nothing is sent anywhere.","effort":"1 hour to draft, 15 min to explain","price":"Free templates","plan_and_price":"Free templates: Michalsons (law firm, for smaller companies), ezel.ai (editable), Drata (for small teams), Securityscientist (Word file, may ask for an email).","readings":[{"value":"3","label":"data levels: green, amber, red"},{"value":"2–3 pages","label":"recommended length for a small-business AI policy"},{"value":"6","label":"areas to cover: tools, data, human review, exceptions, training, consequences"}],"try_before_friday":"Each person writes down 10 things they pasted or would like to paste into AI this month, using made-up wording, for example 'VIP client list from 1C'. They sort each one into green, amber or red using the table at the top of this page. Bring the disagreements to the meeting.","good_for":["Making the Friday discussion concrete","Onboarding new staff","Showing the board that the risk is managed"],"not_for":["Replacing a legal check of customer-data processing","Technical blocking (see Purview)"],"better":"","advice":"Make every rule something you can check: 'no customer names in prompts' can be verified by reading a chat history in five minutes. Name an owner and a review date.","confidentiality":"No data goes anywhere: this is a document. Proposed rules: GREEN = public or made-up content, in any approved tool. AMBER = internal plans, totals, supplier names, only in company business accounts (Copilot Chat with the green shield, ChatGPT Business, Claude Team). RED = customer personal data, exact turnover or margins per boutique, supplier prices and contracts, staff data, 1C exports, passwords. Never put RED in a cloud AI; use a local model or anonymise first.","sources":["https://www.michalsons.com/focus-areas/artificial-intelligence-law/free-generative-ai-acceptable-use-policy","https://ezel.ai/templates/generative-ai-acceptable-use-policy","https://drata.com/blog/introducing-ai-policy-template","https://ud.hk/en/blogs/insight/article/2026-07-09-ai-use-policy-small-business","https://omconcepts.net/blog/one-page-ai-policy"],"library_id":"","section":"safe","id":"green-amber-red-paste-rules-one-page-ai-policy"},{"name":"Azerbaijan Law on Personal Data + GDPR basics","url":"https://www.dlapiperdataprotection.com/?c=AZ&t=law","category":"Legal basics","what":"The rules that decide whether customer data may go into a foreign AI service: the Azerbaijani law on personal data, plus the EU's GDPR when serving people in the EU.","for_you":"This is why customer data is RED, while turnover is a business-secret question rather than a privacy-law one. The catch: sources disagree on the 2024–2026 details, so check with local counsel.","verdict":"Try now","verdict_detail":"","safe_level":"red","safe_line":"Customer personal data never goes into any cloud AI until a lawyer confirms consent covers it.","effort":"20 min to read","price":"Free to read","plan_and_price":"Free to read. Legal review by a Baku law firm is extra.","readings":[{"value":"No. 998-IIIQ","label":"Law on Personal Data, 11 May 2010"},{"value":"Written","label":"consent generally needed to process data and pass it on or abroad"},{"value":"Art. 3(2)","label":"GDPR applies when offering goods or services to people in the EU"}],"try_before_friday":"Take one real-looking but MADE-UP customer record (name, phone, purchase) and decide as a team which parts could go into AI (the purchase category, the season) and which never (name, phone). Rewrite it as 'Client A, Baku, bought a 12-piece tableware set'.","good_for":["Deciding what may go into AI","Writing consent text for loyalty and CRM forms","Talking to IT and legal"],"not_for":["A final legal opinion"],"better":"","advice":"Ask a Baku law firm two yes/no questions before scaling AI: (1) does our customer consent cover processing by foreign AI providers, and (2) is any of our data subject to localisation? Until then, keep customer data RED.","confidentiality":"Key points, as reported by law firms: (1) processing personal data generally needs the person's written consent, which may also be an electronic document with an enhanced e-signature (Gratanet, Sep 2024). (2) Passing data to others or abroad generally needs written consent unless the law says otherwise (Art. 13.1). One 2026 firm says transfers abroad need 'adequate protection' in the receiving country. (3) Personal data information systems must be registered; the regulator is the Ministry of Digital Development and Transport. (4) One firm (VLO, Apr 2026) reports that certain financial, telecom and public-sector data must stay on servers in Azerbaijan; this is not confirmed elsewhere. (5) New platform rules adopted 5 Aug 2026 apply to social networks, not to retailers. GDPR applies if we offer goods or services to people in the EU or track their behaviour. Practical result: no customer names, phones or purchase histories in any cloud AI.","sources":["https://www.dlapiperdataprotection.com/?c=AZ&t=law","https://gratanet.com/publications/data-protection-and-employee-privacy-in-azerbaijan","https://www.caspianlegalcenter.az/insights/more/personal-data-azerbaijan","https://vlolawfirm.com/tpost/azerbaijan-data-protection","https://gratanet.com/publications/new-regulatory-requirements-for-social-network-platforms-and-their-providers-in-azerbaijan","https://gdpr-info.eu/art-3-gdpr/"],"library_id":"","section":"safe","id":"azerbaijan-law-on-personal-data-gdpr-basics"},{"name":"Free and personal AI apps, and hosted DeepSeek (what to avoid)","url":"https://www.deepseek.com","category":"What to avoid","what":"Free chat apps (DeepSeek's site and app, and personal free accounts of ChatGPT, Claude and Gemini) that many people already use privately.","for_you":"This is the real leak risk your team worries about. Banning them only works if a business plan is available instead.","verdict":"Skip","verdict_detail":"","safe_level":"red","safe_line":"Personal and free accounts may train on chats; DeepSeek stores data in China. No company data here.","effort":"5 min to write the rule","price":"Free","plan_and_price":"Free","readings":[{"value":"China","label":"where DeepSeek stores user data"},{"value":"Opt-out","label":"training on free/personal accounts of the big apps"},{"value":"Company only","label":"the rule: company work on company AI accounts"}],"try_before_friday":"Each person lists which AI apps they already use and on which account (work or personal). This list is the starting point for the red-list rule.","good_for":["Nothing with company data"],"not_for":["Turnover, customer lists, supplier prices, unreleased collections, staff data"],"better":"Copilot Chat (free with Microsoft 365) or one paid team plan.","advice":"Write one clear rule for Friday: company work only on company AI accounts, nothing confidential in any free app.","confidentiality":"DeepSeek's privacy policy stores data on servers in China and allows inputs to be used to improve its technology. Hundreds of companies and several governments have banned it. Free and personal tiers of ChatGPT, Claude and Gemini may train on chats unless the user opts out. DeepSeek's open weights (MIT) are fine ONLY when run on your own machine.","sources":["https://techcrunch.com/2025/02/03/deepseek-the-countries-and-agencies-that-have-banned-the-ai-companys-tech","https://www.techtarget.com/ai/tip/Does-using-DeepSeek-create-security-risks","https://support.google.com/docs/answer/14615114","Library test a15d879010"],"library_id":"a15d879010","lib_note":"In our library, with test notes","section":"safe","id":"free-and-personal-ai-apps-and-hosted-deepseek-what-to-avoid"},{"name":"Anonymise before you paste (placeholders, Presidio, rizzo-pii)","url":"https://presidio.dataprivacystack.org/","category":"Redaction technique","what":"Replace real names, phones and amounts with placeholders like CLIENT_1 or AMOUNT_A before pasting, then put the real values back yourself. Presidio and rizzo-pii are free tools that do this automatically.","for_you":"Lets the team use AI on real work (a complaint reply, a sales comment) without exposing anyone. The catch: Presidio only knows English out of the box and rizzo-pii is built for Italian, so for Azerbaijani and Russian, do it by hand.","verdict":"Try for <X> only","verdict_detail":"manual placeholders now; tools only for English text or a later IT project","safe_level":"amber","safe_line":"Safe when done right; the key file linking placeholders to real values never leaves your PC.","effort":"15 min to learn the habit","price":"Free","plan_and_price":"Free (open source). The manual method costs nothing.","readings":[{"value":"English only","label":"out-of-the-box language support in Presidio"},{"value":"22","label":"kinds of personal data rizzo-pii hides (Italian-tuned)"},{"value":"Free","label":"open source; the manual method costs nothing"}],"try_before_friday":"Write a made-up customer complaint in Russian ('Айгюн Мамедова, +994 50 123 45 67, купила сервиз за 2 400 AZN...'). Replace the details with CLIENT_1, PHONE_1, AMOUNT_1, ask Copilot Chat for a polite reply, then put the real values back. Time it. Then try an English version in the Presidio demo and see what it catches.","good_for":["Customer-service reply drafts","Analysing feedback without names","Sharing an example with AI"],"not_for":["Azerbaijani or Russian text with automatic tools (not supported out of the box)","Treating automatic redaction as 100% reliable"],"better":"","advice":"Teach the manual method on Friday; it covers most cases. Do not adopt rizzo-pii yet (our library review ran no real files), but adopt the habit: mask names, phones and figures before pasting into any AI.","confidentiality":"With placeholders, the AI never sees the real person or figure, and the key linking placeholders to real values stays in a file on your PC. Presidio and rizzo-pii run on your own machine. Presidio's public demo is on Hugging Face, so put only made-up text into it. Presidio itself warns that automatic detection cannot guarantee it finds everything. rizzo-pii: masked text still goes to the cloud AI, so turnover figures and context words are not hidden unless they match its 22 data types.","sources":["https://presidio.dataprivacystack.org/","https://presidio.dataprivacystack.org/analyzer/languages/","https://huggingface.co/spaces/presidio/presidio_demo","https://rizzo-ai-academy.github.io/rizzo-pii/","Library 6bd954d1f1 (rizzo-pii review)"],"library_id":"6bd954d1f1","lib_note":"In our library: reviewed, not run on real files","section":"safe","id":"anonymise-before-you-paste-placeholders-presidio-rizzo-pii"},{"name":"LM Studio / llama.cpp: AI that runs on your own computer","url":"https://lmstudio.ai","category":"Local AI app","what":"A free desktop app for Mac and Windows that downloads an open AI model (Gemma, Qwen) and runs it on your own computer, so nothing you type goes to the internet.","for_you":"The answer to 'what about really secret numbers?': summarise a turnover table or VIP notes offline. The catch: it needs a strong laptop, and small local models are clearly weaker, especially in Azerbaijani.","verdict":"Try for <X> only","verdict_detail":"RED data that must stay on the machine (turnover tables, internal notes)","safe_level":"green","safe_line":"Text is processed on the laptop; keep the optional cloud features switched off.","effort":"30 min plus a large download","price":"Free","plan_and_price":"Free for personal and internal business use since July 2025 (llama.cpp: MIT). A paid Enterprise plan adds SSO and model controls. Hardware is the cost: a good 27B model's 4-bit file is 16.5 GB, a poor fit for a 16 GB Mac.","readings":[{"value":"3 of 5","label":"Azerbaijani mails sorted right by a tiny local model (our test)"},{"value":"7 of 9","label":"Russian mails right, same test"},{"value":"~3 s","label":"per mail on 2 CPUs"}],"try_before_friday":"On a recent Mac or a PC with 16 GB of memory or more, install LM Studio and download a small model (Gemma 4 or Qwen, about 4–7 GB). Turn Wi-Fi off. Paste a made-up table of 5 boutiques with fake monthly sales and ask 'which boutique fell most, give 3 possible reasons' in Russian. Judge quality and speed.","good_for":["Summarising confidential tables","Removing names and figures before pasting into a cloud AI","Working without internet"],"not_for":["Final Azerbaijani marketing copy","Old or 8 GB laptops"],"better":"For heavy private use, a mid-size Qwen model on the company server via Open WebUI.","advice":"Do not roll it out to everyone. One or two analysts with good laptops are enough for the RED jobs. Use it as the 'safe room' in the paste rules: confidential text goes here, public text goes to the cloud tools.","confidentiality":"LM Studio's privacy policy (effective June 2026) says messages, chat histories and documents are never sent from your computer when you run models locally, and the app has no telemetry. Only model searches and update checks (app version, OS, IP address) go online. Paid cloud features send prompts out, so do not switch them on. Models download from Hugging Face; each has its own licence (Qwen mostly Apache-2.0). Do not install it on shared or personal PCs.","sources":["https://lmstudio.ai/blog/free-for-work","https://lmstudio.ai/app-privacy","https://simonwillison.net/2025/Jul/8/lm-studio-is-free-for-use-at-work","Library test 17b46de13a (llama.cpp, 12 Oct 2026)"],"library_id":"17b46de13a","lib_note":"Tested by us 12 Oct 2026 (llama.cpp, made-up mails)","section":"safe","id":"lm-studio-llama-cpp-ai-that-runs-on-your-own-computer"},{"name":"Gemini in Google Workspace (and the personal-Gmail trap)","url":"https://knowledge.workspace.google.com/admin/gemini/generative-ai-in-google-workspace-privacy-hub","category":"Business plan vs consumer","what":"Google's AI is protected only when used through a paid company Google Workspace account. On a personal Gmail it runs under consumer rules.","for_you":"Italdizain runs on Microsoft 365, so the risk is SMM staff using Gemini or NotebookLM on personal Gmail for work. A business setup would mean paying for a second office suite.","verdict":"Worth a look later","verdict_detail":"","safe_level":"amber","safe_line":"Personal Gmail: chats can train Google's models and be read by reviewers. Public material only.","effort":"10 min to check accounts","price":"€6.80–21.10/user/mo","plan_and_price":"Workspace Business Starter €6.80, Standard €13.60, Plus €21.10 per user per month (workspace.google.com, Oct 2026). Gemini is included.","readings":[{"value":"6 Oct 2026","label":"Workspace privacy hub last updated"},{"value":"Up to 3 years","label":"how long human-reviewed personal Gemini chats are kept"},{"value":"72 h","label":"personal-account retention with Keep Activity off"}],"try_before_friday":"Everyone checks which Google account their Gemini, NotebookLM or AI Studio is signed into. If it is a personal Gmail, use it only for GREEN (public) material, for example 'write 5 hooks for a TikTok about Italian table settings'.","good_for":["Teams already on Google Workspace"],"not_for":["Company work on personal Gmail accounts"],"better":"Copilot Chat covers the same needs inside Microsoft 365.","advice":"Add one line to the policy: 'Google AI tools only with public data unless we buy Workspace'. Do not buy Workspace just for Gemini.","confidentiality":"With a qualifying Workspace account, Google says it does not use prompts or content to train models without permission, and chats are not reviewed by humans; Gemini in Workspace lists ISO 42001, SOC 1/2/3 and ISO 27001/27701. On a personal Gmail, consumer terms apply: with 'Keep Activity' on, chats and uploads can be used to improve Google's services including training, and a subset is read by reviewers and kept up to 3 years (Gemini Apps privacy hub, 24 Sept 2026). Our library notes the free Gemini API tier also uses inputs to improve Google's products.","sources":["https://knowledge.workspace.google.com/admin/gemini/generative-ai-in-google-workspace-privacy-hub","https://workspace.google.com/pricing","https://support.google.com/gemini/answer/13594961"],"library_id":"","section":"safe","id":"gemini-in-google-workspace-and-the-personal-gmail-trap"},{"name":"Microsoft Purview DLP for Edge and Copilot","url":"https://learn.microsoft.com/en-us/purview/dlp-create-policy-block-to-ai-via-edge","category":"Technical blocking (IT)","what":"An IT setting in Microsoft 365 that spots sensitive data (card numbers, IBANs, labelled files, chosen keywords) and blocks it from being typed or uploaded into ChatGPT, Gemini, Copilot and other AI sites.","for_you":"Turns the paste rules into a real barrier, so a tired employee cannot leak a client list by accident. The catch: it needs company-managed Windows PCs (Intune), Purview billing and an IT person.","verdict":"Try for <X> only","verdict_detail":"an IT pilot on a few company PCs, in simulation mode first","safe_level":"green","safe_line":"Runs inside your own Microsoft 365; a guardrail, not permission to paste RED data.","effort":"Half a day for IT","price":"Purview licence / pay-as-you-go","plan_and_price":"Pay-as-you-go or per-user Purview licensing, depending on the feature. Blocking Copilot from labelled files originally required a Copilot licence plus E5 or equivalent. Business Premium coverage is unconfirmed; check in the Purview portal.","readings":[{"value":"29 Jul 2026","label":"Microsoft Learn guide last updated"},{"value":"Intune","label":"devices must be managed by Intune"},{"value":"Simulation","label":"mode to test first without blocking anyone"}],"try_before_friday":"Ask IT one question before Friday: 'Are our PCs Intune-managed and do we have Purview DLP?' In the meeting, show the Microsoft Learn example (block bank numbers and SWIFT codes in AI prompts).","good_for":["Blocking card, bank and ID numbers in AI prompts","Stopping Copilot from reading files labelled 'Confidential'","A custom keyword list such as 'dövriyyə', 'оборот', 'turnover'"],"not_for":["Personal phones and unmanaged laptops","Spotting turnover figures with no pattern, unless you build custom rules"],"better":"Browser DLP extensions (Strac, Nightfall) if Intune and Purview are not available.","advice":"Start with sensitivity labels ('Confidential – no AI') on turnover files and a Copilot DLP rule. Add blocking on AI websites only after a month in simulation.","confidentiality":"The browser checks the prompt on the PC and stops matches before they are sent. Purview runs inside your Microsoft 365. When set to block, other browsers (Firefox, and Chrome without the Purview extension) are blocked on managed PCs. An admin can also set a Purview rule that blocks Copilot prompts containing chosen sensitive data (rolled out spring 2026).","sources":["https://learn.microsoft.com/en-us/purview/dlp-create-policy-block-to-ai-via-edge","https://m365admin.handsontek.net/dlp-policies-will-able-block-copilot-processing-sensitivity%e2%80%91labeled-files-storage-locations/","https://mc.merill.net/message/RM486368","https://mc.merill.net/message/MC1181998"],"library_id":"","section":"safe","id":"microsoft-purview-dlp-for-edge-and-copilot"},{"name":"Browser DLP extensions (Strac, Nightfall)","url":"https://www.strac.io/integrations/browser-dlp","category":"Paste-blocking extension","what":"Company browser add-ons that watch what you paste or upload into ChatGPT, Claude, Gemini or Copilot and block, mask or warn before it is sent.","for_you":"A route if Purview is not available. Works in Chrome, Edge, Firefox and Safari. The catch: prices only via sales, IT must push the extension, and free look-alike extensions are a risk themselves.","verdict":"Worth a look later","verdict_detail":"","safe_level":"amber","safe_line":"The vendor's console sees snippets of what it flags; ask for SOC 2 report and DPA.","effort":"A demo call plus 1 hour for IT","price":"Quote only","plan_and_price":"Strac: book a demo, no public price. Nightfall: Foundation and Premier editions priced per user per year, quote only, 7-day proof of value.","readings":[{"value":"100+","label":"types of sensitive data Strac says it detects"},{"value":"SOC 2 + ISO 27001","label":"claimed by both vendors"},{"value":"7 days","label":"Nightfall proof-of-value trial"}],"try_before_friday":"No install before Friday. Look at Strac's page and note which AI sites and actions (block, redact, alert) it lists, so the meeting can compare it with Purview.","good_for":["Teams without Intune or Purview","Covering many AI sites at once"],"not_for":["Small budgets (quote only)","Catching business secrets that have no pattern"],"better":"Microsoft Purview, if your licences cover it; it is already in the house.","advice":"Treat Strac or Nightfall as plan B. Avoid tiny free paste-guard extensions: they ask for clipboard and all-site access and can become the leak.","confidentiality":"The extension reads what you type and paste on AI sites, and sends findings to the vendor's console, so the vendor sees snippets of your data. Ask for their SOC 2 report and DPA. Avoid tiny free extensions (some have 2 users and version 0.1).","sources":["https://www.strac.io/integrations/browser-dlp","https://www.nightfall.ai/pricing","https://addons.mozilla.org/addon/strac-browser-dlp/"],"library_id":"","section":"safe","id":"browser-dlp-extensions-strac-nightfall"},{"name":"Canva Business (Magic Studio)","url":"https://www.canva.com/","category":"Design and social posts","what":"Online design tool with AI built in. It makes posts and stories, resizes one design for every channel, removes backgrounds, writes captions and keeps your brand kit.","for_you":"Probably the fastest daily win for the SMM team: brand kit plus one-click resizing for Instagram, Facebook and TikTok. Canva says Business content never trains its AI. The catch: IP indemnity is for eligible Enterprise customers only.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Business/Teams: content never used for AI training. Free and Pro: training on by default.","effort":"30 min to start","price":"~$25/user/mo","plan_and_price":"Business about $25/user/month or $250/user/year, no seat minimum (third-party 2026 guides; Canva's pricing page could not be read). Pro $18/month is for a single person only. Enterprise: price on request.","readings":[{"value":"Never","label":"Business content used for AI training (Canva's statement)"},{"value":"~$25","label":"per person per month, Business (third-party)"},{"value":"SOC 2 + ISO 27001","label":"listed on Canva's security page"}],"try_before_friday":"Build a Brand Kit with the Italdizain logo, colours and fonts. Take one product photo already published on italdizain.az, make a post with Magic Design, then use Magic Resize to make a story, a TikTok cover and a Facebook post. Time it against the usual way.","good_for":["Social posts, stories and covers in many sizes","Keeping brand fonts and colours consistent","Simple promo videos and banners"],"not_for":["Photo-real luxury product imagery","Anything needing IP indemnity unless on Enterprise"],"better":"","advice":"Everyone must work inside one company Business team, not personal Free or Pro accounts. Personal accounts are where AI training is on by default. Check the privacy toggle shows as disabled.","confidentiality":"Where data goes: Canva's cloud; Canva does not publish the country. Training by plan: Teams, Business, Enterprise and Education: Canva says content is not used to improve its AI, this cannot be switched on, and third-party AI providers may not train on it either. Free and Pro: training is ON by default and must be switched off in Privacy settings. Certifications: SOC 2 Type II and ISO 27001. Indemnity: Canva Shield covers eligible Enterprise customers only. Do not put turnover, prices not yet public, customer names or photos into designs. (Canva's pages block automated reading; facts from Canva search snippets.)","sources":["https://www.canva.com/newsroom/news/safe-ai-canva-shield/ (via search snippet)","https://www.canva.com/trust/privacy/ (via search snippet)","https://canva.com/security/ (via search snippet)","https://piktochart.com/blog/canva-pricing-2026-costs-raised/ (third-party prices)"],"library_id":"","section":"content","id":"canva-business-magic-studio"},{"name":"Adobe Firefly (with Express, Photoshop and Firefly Boards)","url":"https://www.adobe.com/products/firefly.html","category":"Commercially safe images and video","what":"Adobe's AI for images, video and design. Its own models are trained only on licensed content. Our library's technique: send a supplier packshot from Photoshop to Firefly Boards, generate a luxury scene around it, then blend the product back in.","for_you":"The most luxury-safe generator: lifestyle backgrounds around your real packshots, Content Credentials labels, and IP indemnity for enterprise customers. The catch: partner models (Runway, Kling, FLUX) are 'check yourself', and fine jewellery details can change.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Adobe says it never trains Firefly on user content, including partner models inside its apps.","effort":"30 min per product photo","price":"From €18.48/seat/mo","plan_and_price":"Team plans per licence per month (excl. VAT, annual): Firefly Pro for teams €18.48 (4,000 credits), Pro Plus €46.21, Premium €184.86. Individual: Standard €11.17, Pro €22.36. A limited free plan exists. (Adobe plans page, 13 Oct 2026.)","readings":[{"value":"€18.48","label":"per team seat per month (excl. VAT)"},{"value":"Never","label":"user content used to train Firefly (Adobe)"},{"value":"Enterprise only","label":"IP indemnity"}],"try_before_friday":"Take one public packshot from italdizain.az, for example a vase or a watch. In Firefly or Photoshop (Firefly Boards), generate three backgrounds: a marble console, a Caspian-view terrace and dark velvet. Use only Adobe's own 'Firefly Image' model. Zoom to 200% and check the logo, engraving and colour are untouched.","good_for":["Lifestyle and campaign backgrounds around real products","Brand-safe images for ads","Short videos and resizing in Adobe Express"],"not_for":["Catalogue-exact white-background shots (use Photoroom)","Relying on partner-model output for final ads"],"better":"","advice":"Use Adobe's own Firefly models for anything you publish, and keep partner models for ideas. Make 'compare with the original before publishing' a fixed step. If the team adopts it widely, ask Adobe for an enterprise plan with indemnity in writing.","confidentiality":"Training: Adobe says it does not train, and never has trained, Firefly on user content, and customer content is not used to train generative models, including partner models inside Adobe apps. Abuse review: prompts and results may be checked automatically or by people (Gen AI guidelines, 15 May 2026); non-generative features such as masking learn from content unless you opt out. Legal cover: Adobe's own models are 'commercially safe'; for partner models you check suitability yourself. IP indemnity covers eligible enterprise customers only; a community expert (Sept 2026, not official) reports it covers Firefly, Google and OpenAI models but not Runway, Kling, Black Forest Labs or 'beta' features. Data location: not published. Do not upload unreleased collections until the plan is confirmed.","sources":["https://www.adobe.com/ai/overview/firefly/gen-ai-approach.html","https://www.adobe.com/products/firefly/plans.html (read 13 Oct 2026)","https://www.adobe.com/legal/licenses-terms/adobe-gen-ai-user-guidelines.html","https://community.adobe.com/questions-404/using-firefly-ai-assistant-beta-for-final-production-and-i-indemnification-1640494 (community, not official)","https://www.adobe.com/learn/photoshop/web/generate-product-backgrounds-firefly-boards","Library 83d94e26be (Firefly Boards + Photoshop technique)"],"library_id":"83d94e26be","lib_note":"In our library: read through, not hands-on tested","section":"content","id":"adobe-firefly-with-express-photoshop-and-firefly-boards"},{"name":"Photoroom","url":"https://www.photoroom.com/","category":"Product photos and packshots","what":"App and API that cut products out, put them on clean or styled backgrounds, add shadows and batch-produce catalogue images.","for_you":"Fast, consistent packshots for the website and marketplaces across many brands, with up to 50 team seats per plan. The catch: data is hosted in the US, and self-serve plans train on images until you switch it off.","verdict":"Try now","verdict_detail":"","safe_level":"amber","safe_line":"Switch the training toggle off first; US hosting only. Public product photos are fine.","effort":"30 min to start","price":"~$13–35/mo","plan_and_price":"Pro (8,000 AI credits), Max (25,000) and Ultra (75,000), each with up to 50 seats. Prices show only at checkout; third-party figures put Pro at about $12.99/month and Max at about $34.99/month. Enterprise is custom with SSO and an SLA.","readings":[{"value":"US only","label":"data hosting"},{"value":"Opt-out","label":"training on self-serve plans"},{"value":"50 seats","label":"maximum per paid plan"}],"try_before_friday":"First switch the training toggle off. Then take 5 public product photos from the website (a watch, a glass, a cushion, a vase, a lamp), run a batch white background with soft shadow, and check logos and engravings at 200% zoom.","good_for":["White-background catalogue shots","Marketplace and website images in bulk","Simple styled backgrounds"],"not_for":["Unreleased products before opting out of training","Teams that need EU data residency"],"better":"","advice":"Good for the bulk catalogue work that eats time. Its Enterprise fidelity check flags when AI changed the product, which matters for jewellery and watches.","confidentiality":"Training by plan (Photoroom security page, 2026): Enterprise: no training unless agreed in writing. Self-serve API: used for training by default, with an opt-out. App users: a separate opt-out toggle, and personal data is anonymised before any training. Retention: sync API images discarded straight away, operational logs after 15 days, access logs after 1 year. Hosting: US (GCP and AWS), no EU-only residency. SOC 2 Type 2, scoped to the API (April 2026). DPA for Enterprise.","sources":["https://www.photoroom.com/platform/security","https://www.photoroom.com/pricing (read 13 Oct 2026)","https://costbench.com/software/ai-design-tools/photoroom (third-party prices)","Library 5c409405b9 (Photoroom Visual Agents)"],"library_id":"5c409405b9","lib_note":"In our library (vendor card, not hands-on tested)","section":"content","id":"photoroom"},{"name":"Claid.ai","url":"https://claid.ai/","category":"Product photo fixing","what":"Product-photo AI that upscales, fixes lighting, removes backgrounds, adds shadows and generates 'AI photoshoots' around your real product.","for_you":"Useful for rescuing low-quality supplier photos. The catch: no security certificates published, and a vague privacy policy from 2024.","verdict":"Try for <X> only","verdict_detail":"improving supplier photos that are already public","safe_level":"amber","safe_line":"No SOC 2/ISO, training on uploads not stated. Upload only images already public.","effort":"20 min","price":"50 free credits","plan_and_price":"Free trial with 50 credits. Essentials and Pro are paid (prices not readable); Business is custom. AI photoshoot 4 credits, 5 s video 60 credits, background removal 1 credit.","readings":[{"value":"50","label":"free trial credits"},{"value":"May 2024","label":"date of current privacy policy"},{"value":"None found","label":"SOC 2 / ISO certificates"}],"try_before_friday":"On the free 50 credits, upload 3 low-resolution supplier photos that are already on the website. Run Upscale, light correction and AI Shadows, then compare before and after side by side.","good_for":["Upscaling small supplier images","Fixing light and shadows"],"not_for":["Unreleased products","Anything needing a signed DPA without asking first"],"better":"Photoroom has clearer published security terms.","advice":"Use it as a fixer, not a main platform. Before any paid plan, ask Claid in writing whether uploads train its models.","confidentiality":"Under its privacy policy (effective 21 May 2024), Claid acts as a data processor and says it does not sell, share or rent account data. Data is kept 'as long as we deem necessary'; California law applies; server location not stated. Training on uploads: not stated. No SOC 2 or ISO 27001 found on its site.","sources":["https://claid.ai/pricing (read 13 Oct 2026)","https://claid.ai/privacy-policy","https://claid.ai/security"],"library_id":"","section":"content","id":"claid-ai"},{"name":"Google Gemini (Nano Banana) and Flow (Veo 3.1)","url":"https://labs.google/fx/tools/flow","category":"AI video and images","what":"Google's image model (Nano Banana) and video model (Veo 3.1), used in the Gemini app and Flow. They make realistic images and short clips with sound.","for_you":"Among the best-looking models for reels. The catch: Italdizain runs on Microsoft, not Google Workspace, so you would use personal Google accounts, where uploads can train Google's models and be read by reviewers.","verdict":"Try for <X> only","verdict_detail":"ideas and mood clips with made-up or already-public material","safe_level":"amber","safe_line":"Personal Google accounts may train on uploads; made-up or public material only.","effort":"20 min","price":"~$19.99/mo (AI Pro)","plan_and_price":"Google AI Pro about $19.99/month with 1,000 Flow credits; a 10-second Veo 3.1 clip uses about 125 credits (third-party guides). Some free daily credits exist.","readings":[{"value":"Up to 3 years","label":"how long reviewed chats are kept"},{"value":"13 of 141","label":"prompt-gallery examples that are product-related (our library check)"},{"value":"~$19.99","label":"per month, Google AI Pro"}],"try_before_friday":"On a test Google account with Keep Activity off, generate 3 clips of a made-up 'candle-lit dinner table with crystal glasses' using no real product photos. Judge whether the look fits Italdizain.","good_for":["Mood clips and ideas for reels","Testing visual concepts"],"not_for":["Real unreleased products","Company workflow on personal accounts"],"better":"Adobe Firefly, which offers the same Google models under Adobe's no-training terms.","advice":"If you buy Adobe Firefly, use Nano Banana and Veo inside Firefly instead. Don't build a workflow on personal Google accounts. The public Nano Banana prompt galleries are a source of ideas, not recipes: their licence is contradictory.","confidentiality":"Personal accounts (Gemini Apps privacy hub, 24 Sept 2026): with 'Keep Activity' on, Google uses chats and uploaded photos and videos to improve its services, including training generative AI. A subset of chats is read by reviewers and kept up to 3 years. With Keep Activity off, chats are kept 72 hours. Outputs carry an invisible SynthID watermark. Do not upload unreleased products, staff or customer faces.","sources":["https://support.google.com/gemini/answer/13594961","https://labs.google/fx/tools/video-fx/pricing","https://magichour.ai/blog/veo-3-pricing (third-party prices)","Library tests 2c30995dbf and 3d297ef525 (Nano Banana prompt galleries)"],"library_id":"2c30995dbf","lib_note":"Prompt galleries checked by us","section":"content","id":"google-gemini-nano-banana-and-flow-veo-3-1"},{"name":"Runway","url":"https://runway.com/","category":"AI video studio","what":"AI video studio that turns images and text into short clips, and extends, restyles and edits footage.","for_you":"Strong creative control for reels and mood videos. The catch: on normal plans, your uploads and results may be used to train Runway's models under a permanent licence. Only an Enterprise contract excludes this.","verdict":"Try for <X> only","verdict_detail":"test clips and mood videos from already-public images","safe_level":"amber","safe_line":"Self-serve terms allow training on inputs and outputs (irrevocable licence). Public images only.","effort":"20 min","price":"From $12/mo","plan_and_price":"Free: 125 one-time credits. Standard $12/month annual or $15 monthly, 625 credits (about 52 s of Gen-4.5). Higher tiers and Enterprise (custom).","readings":[{"value":"Irrevocable","label":"training licence on inputs/outputs (self-serve)"},{"value":"$12","label":"per month, Standard (annual)"},{"value":"SOC 2 + ISO 27001","label":"security certifications"}],"try_before_friday":"Take one campaign image already on Italdizain's Instagram and make a 5-second slow push-in clip on the free credits. Check whether the product shape or logo changes.","good_for":["Animating a still campaign image","Mood and teaser clips"],"not_for":["Unreleased collections","Anything confidential on self-serve plans"],"better":"Adobe Firefly video, for brand-safe terms.","advice":"Fine for experiments. If video becomes a big part of the plan, ask for Enterprise terms in writing, or use Adobe Firefly video instead.","confidentiality":"Terms of Use (15 Sep 2026): inputs and outputs 'may be used by the Company to train and improve its AI models', under an irrevocable, perpetual, sublicensable licence. Separate Enterprise Services Terms apply to Enterprise customers. Security page (Aug 2026): SOC 2 Type II and ISO 27001. Data location: not stated. You own outputs; commercial use allowed.","sources":["https://runway.com/terms-of-use (updated 15 Sep 2026)","https://runway.com/data-security","https://runway.com/pricing (read 13 Oct 2026)"],"library_id":"","section":"content","id":"runway"},{"name":"Midjourney","url":"https://www.midjourney.com/","category":"Mood boards and concept art","what":"A popular image generator known for artistic, editorial looks. Mainly used for mood boards and concepts.","for_you":"Great for mood boards for shoots, window displays and interiors. The catch: everything is public by default, companies over $1M revenue must pay for Pro or Mega, there is no indemnity, and its training data is legally disputed.","verdict":"Try for <X> only","verdict_detail":"internal mood boards from text prompts, never published as final ads","safe_level":"red","safe_line":"Images and prompts are public by default. Never upload products or faces.","effort":"15 min","price":"From $60/mo","plan_and_price":"Pro $60/month, Mega $120/month, 20% off yearly; required for companies over $1M revenue (Midjourney plans page).","readings":[{"value":"Public","label":"default visibility of your images"},{"value":"$60","label":"per month minimum for a company like Italdizain"},{"value":"None","label":"IP indemnity"}],"try_before_friday":"There is no free plan. Only someone who already has an account should build a mood board for a made-up 'Venetian Christmas' window from text prompts, with no uploads. Everyone else browses the public Explore gallery and judges the style.","good_for":["Mood boards","Concept images for shoots and displays"],"not_for":["Uploading products or faces","Final published ads"],"better":"Adobe Firefly for anything that will be published.","advice":"Keep it for inspiration only. For anything that will be published, re-create the idea in Adobe Firefly.","confidentiality":"By default your images and prompts are publicly viewable and can be remixed. Stealth Mode only on Pro ($60) and Mega ($120); it is 'best efforts', and images made in shared Discord channels stay visible. No security certificates found, no user indemnity. Disney and Universal sued Midjourney in June 2025, so publishing its output carries IP risk. (Terms page blocks automated reading; via search snippet.)","sources":["https://docs.midjourney.com/hc/en-us/articles/32083055291277-Terms-of-Service (via search snippet)","https://docs.midjourney.com/hc/en-us/articles/27870484040333-Comparing-Midjourney-Plans","https://docs.midjourney.com/hc/en-us/articles/32019750070669-Stealth-Mode"],"library_id":"","section":"content","id":"midjourney"},{"name":"Kling AI","url":"https://klingai.com/","category":"AI video","what":"Video generator from China's Kuaishou that makes realistic clips from text or images. It is also offered inside Adobe Firefly and Higgsfield.","for_you":"High video quality, but its terms don't fit a luxury brand: inputs can train its models, outputs must carry a Kling label, and commercial use needs written permission.","verdict":"Skip","verdict_detail":"","safe_level":"red","safe_line":"Terms allow training on your inputs and forbid commercial use without written permission.","effort":"10 min to read terms","price":"Not checked","plan_and_price":"Not checked (it is skipped).","readings":[{"value":"21 Apr 2026","label":"terms date"},{"value":"Required","label":"'Kling AI' label on outputs"},{"value":"Written permission","label":"needed for commercial use"}],"try_before_friday":"Don't use it. Read sections 4.5 to 4.7 of the terms (10 minutes) and bring them to Friday as an example of what to look for in any AI tool's terms.","good_for":["Learning what risky AI terms look like"],"not_for":["Any Italdizain brand content"],"better":"Adobe Firefly video or Runway.","advice":"If someone loves the look, test it only inside Adobe Firefly with made-up prompts, and never publish the result as a final ad.","confidentiality":"Kling Terms of Service (21 Apr 2026): section 4.7 gives Kling a licence to host, reproduce, modify and distribute inputs and outputs, and to use input to train its models (revocable by emailing support). Section 4.5: outputs must be labelled 'Kling AI'. Section 4.6: no commercial use without written permission. Paid-service terms may differ (not checked). Through Adobe Firefly, Kling is a partner model not covered by Adobe's indemnity.","sources":["https://app.klingai.com/global/docs/user-policy (updated 21 Apr 2026)"],"library_id":"","section":"content","id":"kling-ai"},{"name":"CapCut","url":"https://www.capcut.com/","category":"Video editing","what":"Video editor from ByteDance, the owner of TikTok, with AI captions, templates, auto-cut and effects. Many SMM teams already use it.","for_you":"Probably already on your team's phones. Its terms give it a permanent, transferable licence over your uploads, including people's likeness, and its music is not cleared. Brand work should move to a safer editor.","verdict":"Skip","verdict_detail":"","safe_level":"red","safe_line":"Perpetual, sublicensable licence over uploads incl. faces. No unreleased products or people.","effort":"30 min to compare","price":"Free / paid","plan_and_price":"Free and paid plans (prices not checked, since it is skipped).","readings":[{"value":"Perpetual","label":"licence over your uploads"},{"value":"15 Apr 2026","label":"terms date"},{"value":"Not licensed","label":"music for your use"}],"try_before_friday":"Everyone who uses CapCut lists recent projects that contained unreleased products or people. Then re-make one recent reel in Adobe Express or Canva and compare the time it takes.","good_for":["Personal or already-public content only"],"not_for":["Unreleased products","People's faces","Ads with CapCut music"],"better":"Adobe Express or Canva Business video tools.","advice":"Don't ban it overnight. Agree that brand and unreleased material moves to Adobe Express, Premiere or Canva video, and that CapCut music is never used in ads.","confidentiality":"Terms (15 Apr 2026, section 10): users grant a non-exclusive, royalty-free, transferable, sublicensable, perpetual, worldwide licence to modify, reproduce, publish and distribute their content, including username, image and likeness, also in sponsored content, surviving after you stop using the app. AI training is not mentioned explicitly. No rights to sound recordings are licensed.","sources":["https://www.capcut.com/clause/terms-of-service (updated 15 Apr 2026)","https://larryjordan.com/articles/caution-capcut-changed-their-license-and-may-own-your-content/ (commentary)"],"library_id":"","section":"content","id":"capcut"},{"name":"Brand-voice assistant and shared prompt library","url":"https://support.claude.com/en/articles/12512180-using-skills-in-claude","category":"Brand voice setup","what":"One saved assistant (a Claude Project or Skill, a Custom GPT, or a Copilot agent) that already knows Italdizain's tone, banned words, hashtags and language rules, plus a shared folder of tested prompts everyone reuses.","for_you":"Every person gets on-brand drafts without re-explaining, and the red list lives inside the assistant. The catch: someone must own and update it, or it goes stale.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Only as safe as the plan it runs on: build it on a business plan, with public brand material only.","effort":"1 hour for a first version","price":"Included in chat plan","plan_and_price":"Included in Claude Team, ChatGPT Business or Copilot. No extra cost.","readings":[{"value":"0 extra","label":"cost on top of the chat plan"},{"value":"View-only","label":"shared Claude Skills for colleagues"},{"value":"1 page","label":"voice guide in AZ/RU/EN with do and don't examples"}],"try_before_friday":"Each team member writes down the 3 prompts they would use most. Merge them into one page with the brand voice rules and the red list, load it into the tool you are testing, and have two people run the same prompt to see if the results match.","good_for":["A 1-page voice guide in AZ/RU/EN","A red list: never paste turnover, client names or phones, VIP lists, supplier prices","Ready prompts for captions, SEO meta texts, ad variants"],"not_for":["Storing customer lists or sales figures inside the assistant"],"better":"Anthropic's public skills repo as a pattern book (our test: useful as templates, not to install wholesale).","advice":"Give it one owner, put a version date on it, and check every quarter which prompts people actually use.","confidentiality":"Build it on Claude Team, ChatGPT Business or Copilot, never on personal accounts. Put only public brand material in it: tone, sample posts, product facts from the website. On Claude Team, admins can push a Skill to all users; shared Skills are view-only, and access ends when someone leaves. One third-party blog says org-wide sharing has no approval step, so keep the sharing setting tight.","sources":["https://support.claude.com/en/articles/12512180-using-skills-in-claude","https://claude.com/blog/organization-skills-and-directory","https://www.gend.co/en-ca/blog/deploy-manage-claude-skills","Library test fcd4de8b9d (Anthropic skills repo)"],"library_id":"fcd4de8b9d","lib_note":"Related skills repo tested by us","section":"content","id":"brand-voice-assistant-and-shared-prompt-library"},{"name":"Google Search Console AI setup + GA4 Analytics Advisor","url":"https://developers.google.com/search/blog/2025/12/ai-powered-configuration","category":"Free Google analytics AI","what":"Ask Google's own tools questions in plain words, like 'which pages lost clicks from mobile last month?', and get the report built for you.","for_you":"italdizain.az already runs GA4, so this is AI on data Google already holds, with no new company involved. The catch: the GA4 Advisor works only with the interface in English, and both features are still beta or experimental.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Data stays inside Google; nothing new is shared. Don't upload sales or 1C files into GA4.","effort":"15 min to start","price":"Free","plan_and_price":"Free (Search Console and GA4 standard)","readings":[{"value":"G-SK931H32DT","label":"GA4 tag found on italdizain.az, 13 Oct 2026"},{"value":"English only","label":"GA4 Advisor interface language"},{"value":"Dec 2025","label":"Search Console AI setup announced (experimental)"}],"try_before_friday":"In Search Console > Performance, type: 'Compare clicks for queries containing saat (watches) last 3 months vs previous 3 months, mobile only'. Check that the filters it set are right. In GA4, switch the interface language to English and ask Advisor: 'Why did sessions drop last week?'","good_for":["Weekly 'what changed' questions without building reports","Finding which brand or category pages gain or lose search clicks"],"not_for":["Anything involving turnover or customer lists","Exporting data (the Search Console AI does not export)"],"better":"","advice":"Make this the team's first step. Always check the filters the AI chose, because Google warns it can misread a request.","confidentiality":"Your data stays inside Google. Search Console holds search questions and page clicks, not customer names. Google's help page says Advisor uses only data from that one GA4 property. Whether chats are used to train models is not stated (unknown). Do not upload sales or 1C files into GA4 to 'help' the AI.","sources":["https://developers.google.com/search/blog/2025/12/ai-powered-configuration","https://support.google.com/analytics/answer/16675569?hl=en","https://developers.google.com/search/docs/appearance/ai-features"],"library_id":"","section":"seo","id":"google-search-console-ai-setup-ga4-analytics-advisor"},{"name":"Bing Webmaster Tools – AI Performance report","url":"https://blogs.bing.com/webmaster/February-2026/Introducing-AI-Performance-in-Bing-Webmaster-Tools-Public-Preview","category":"AI-search visibility, free","what":"A free report showing how often Microsoft Copilot and Bing's AI answers cite your website as a source, and for which questions.","for_you":"The only free, first-hand count of AI citations for italdizain.az. The catch: it covers Microsoft's AI only (not ChatGPT or Google), shows no clicks, and is still a public preview.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"You only prove you own the website; the report uses public web data.","effort":"20 min to start","price":"Free","plan_and_price":"Free","readings":[{"value":"10 r $199/mo (50 AI prompts tracked daily); Pro+ $299; Advanced $549; extra users from $45/mo; about 17% less yearly.","readings":[{"value":"50","label":"AI prompts tracked daily on Starter"},{"value":"$45/mo","label":"per extra user"},{"value":"US","label":"data storage"}],"try_before_friday":"On a free account, run a Domain Overview for italdizain.az and two competitors. Then check its AI visibility for 'best luxury watch store in Baku'. Note whether Italdizain is mentioned.","good_for":["Keyword and competitor research in RU and EN","Monthly AI-visibility check across ChatGPT, Gemini, Perplexity and Google AI"],"not_for":["Internal sales data","Very small budgets (start with the free plan)"],"better":"","advice":"Pick Semrush or Ahrefs, not both. Semrush is the safer choice on AI training. Start on the free plan; pay for one month only if the team uses it weekly.","confidentiality":"Semrush's AI terms say it does not train models on what you type and does not let its AI suppliers do so. Data stored in US data centres (AWS, Google Cloud). Security page shows PCI DSS Level 1; SOC 2 and ISO 27001 not stated on its own page. A DPA is published. Only public data is needed.","sources":["https://www.semrush.com/pricing/","https://www.semrush.com/company/legal/semrush-artificial-intelligence-services-terms","https://www.semrush.com/company/security/"],"library_id":"","section":"seo","id":"semrush-seo-ai-search-plans"},{"name":"Otterly.AI","url":"https://otterly.ai/pricing","category":"AI-search visibility tracker","what":"Asks ChatGPT, Google AI Overviews, Perplexity and Copilot your chosen questions every day and reports whether Italdizain or competitors are named and linked.","for_you":"The cheapest serious way to see what AI tells Baku shoppers about Italdizain and its brands. The catch: Gemini, AI Mode and Claude cost extra, and Azerbaijani-language questions are untested.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"EU-hosted app (Frankfurt); you enter only public questions and competitor names.","effort":"30 min to start","price":"From $29/mo","plan_and_price":"Lite $29/mo (15 prompts); Standard $189 (100); Premium $489 (400); Enterprise custom; about 15% off yearly; free trial.","readings":[{"value":"$29/mo","label":"entry price"},{"value":"4","label":"AI engines in every plan"},{"value":"Frankfurt","label":"app hosting"}],"try_before_friday":"Start the free trial and add 10 questions in RU and EN, e.g. 'где купить Rolex в Баку' and 'luxury tableware store Baku'. Note who gets mentioned and which websites are cited.","good_for":["A baseline of AI answers before and after content changes","Seeing which websites the AI cites, so you know where PR is worth doing"],"not_for":["Precise traffic numbers","Enterprise SSO below the custom plan"],"better":"Peec AI (Berlin) is a similar EU option (prices not shown on its page). Profound is the enterprise option (SOC 2 Type II; est. $2,000–5,000/mo).","advice":"Use the cheap Lite plan for 2–3 months to get a baseline before buying anything bigger. Pick questions real customers ask, not brand names only.","confidentiality":"The app runs on AWS in Frankfurt (EU); public monitoring results are stored in the US. Otterly acts as a GDPR data processor; DPA and supplier list available from support. It does not claim its own SOC 2 or ISO; it points to AWS's certificates. You enter only public questions and competitor names.","sources":["https://otterly.ai/pricing","https://otterly.ai/security","https://help.otterly.ai/gdpr-and-other-regulations","https://www.tryprofound.com/pricing"],"library_id":"","section":"seo","id":"otterly-ai"},{"name":"Screaming Frog SEO Spider with AI prompts","url":"https://www.screamingfrog.co.uk/seo-spider/tutorials/how-to-crawl-with-ai-prompts/","category":"Site crawler + bulk AI","what":"A desktop program that reads every page of your website and can run up to 100 AI instructions on each page, for example to write alt text or meta descrip
