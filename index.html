tions.","for_you":"Can draft image descriptions and page summaries for thousands of brand and product pages in AZ, RU and EN in one run. The catch: a bit technical, and each AI provider bills you separately.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Reads only the public site; AI steps follow your chosen provider's terms (use a business key).","effort":"45 min to start","price":"Free ≤500 pages; £199/yr","plan_and_price":"Free up to 500 pages; £199 per year per licence (cheaper from 5 licences); AI usage billed by the provider.","readings":[{"value":"100","label":"custom AI prompts per crawl"},{"value":"500","label":"pages free"},{"value":"£199/yr","label":"licence"}],"try_before_friday":"Download the free version and crawl italdizain.az/en/. Look at the 'H1' and 'Missing alt text' reports. Optional: add a Gemini key and run the built-in 'alt text' prompt on 20 pages.","good_for":["Alt text and meta descriptions at scale","A full technical check of the site"],"not_for":["People who want no setup at all","Judging rankings (it only reads your own site)"],"better":"","advice":"Have one person own it. Always review AI-written descriptions before publishing. Fix the basics first: our public check on 13 Oct found no main H1 on the English homepage, no working sitemap and no language tags linking AZ/RU/EN.","confidentiality":"The crawler runs on your own computer and reads only the public website. AI prompts send page text to the provider you choose (OpenAI, Gemini, Anthropic, Azure OpenAI), or stay on your computer with Ollama or LM Studio. The vendor page says nothing about data handling, so the provider's terms apply. Use a business API key, not a personal one.","sources":["https://www.screamingfrog.co.uk/seo-spider/tutorials/how-to-crawl-with-ai-prompts/","https://www.screamingfrog.co.uk/seo-spider/pricing/"],"library_id":"","section":"seo","id":"screaming-frog-seo-spider-with-ai-prompts"},{"name":"Product descriptions at scale, with a claims check","url":"https://claude.com/pricing","category":"Product copy at scale","what":"Use a business AI chat (Claude Team or ChatGPT Business) to turn a spreadsheet of product facts into SEO-friendly descriptions in Azerbaijani, Russian and English, in Italdizain's tone. Our library's E-commerce Visual Copywriting skill adds a check that holds back any claim not backed by proof.","for_you":"200+ brands means thousands of product and brand texts, and AI can draft them in three languages in hours. The catch: AI invents claims. In our test, the claim-check skill held back 4 of 8 unproven claims.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Product facts are fine on a business plan; never purchase prices, margins, stock or customer names.","effort":"30 min to start","price":"$20–25/seat/mo","plan_and_price":"Claude Team $20/seat/mo yearly or $25 monthly; ChatGPT Business about $20–25/user/mo (third-party figures). The skill is free (MIT).","readings":[{"value":"4 of 8","label":"unproven claims held back in our test"},{"value":"3","label":"verified facts the plan was built on"},{"value":"Off by default","label":"model training on Team/Business plans"}],"try_before_friday":"Make up a 5-row spreadsheet (brand, product, material, size, 3 true facts) plus a few tempting claims ('lead-free', 'bestseller'). Ask the AI for a 120-word description in AZ, RU and EN plus a title under 60 characters. Then ask: 'List every claim you made that is not in my facts.'","good_for":["Brand pages and product texts in three languages","Checking supplier claims before they go on a product page","Rewriting thin category pages"],"not_for":["Final legal wording on certificates or guarantees","Free personal accounts"],"better":"","advice":"Write a one-page style guide (tone, banned words, brand rules) and paste it at the start every time. A native speaker checks the Azerbaijani before anything goes live. We tested the skill in English on one product only, and its own checker failed on the English file, so read its output.","confidentiality":"Claude Team: no training on your content by default, SSO included; no custom retention controls below Enterprise. ChatGPT Business is also excluded from training by default (third-party sources; OpenAI's page could not be read). The skill itself is a local instruction file. Product facts are fine to use. Never include purchase prices, margins, stock levels or customer names. Free personal accounts are not allowed.","sources":["https://claude.com/pricing","https://www.eesel.ai/blog/chatgpt-work-pricing","https://github.com/feichanggege/ecommerce-visual-copywriting-skill","Library test 89b612b53e"],"library_id":"89b612b53e","lib_note":"Tested by us (claim-check skill)","section":"seo","id":"product-descriptions-at-scale-with-a-claims-check"},{"name":"AI analysis of Search Console / GA4 data (exports first, Google Analytics MCP later)","url":"https://github.com/googleanalytics/google-analytics-mcp","category":"AI data analysis","what":"Give a business AI chat your Search Console or GA4 numbers and ask it to find trends, problems and content ideas. Start with downloaded files; later connect it directly through Google's official read-only connector.","for_you":"Turns monthly reporting into a 10-minute conversation. The catch: Google's GA connector (an MCP) is experimental and needs Google Cloud setup by IT. There is no official Search Console connector; third-party ones route your data through outside companies.","verdict":"Try for <X> only","verdict_detail":"Search Console and GA4 exports in a business-plan chat; no direct connections until IT reviews them","safe_level":"amber","safe_line":"Search phrases and clicks are low risk on a business plan; never mix in 1C turnover.","effort":"20 min with exports; 1–2 h of IT time for the connector","price":"Free connector + chat seat","plan_and_price":"Connector free (Apache-2.0); needs a Claude Team or ChatGPT Business seat and a Google Cloud project for the MCP.","readings":[{"value":"Read-only","label":"GA MCP access"},{"value":"None","label":"official Google Search Console connector"},{"value":"10 min","label":"monthly report as a conversation"}],"try_before_friday":"Export the last 3 months of Search Console 'Queries' and 'Pages' as CSV and upload them to a Team or Business chat. Ask: 'Which 10 pages have many views in Google but few clicks, and how should their titles change?'","good_for":["Monthly SEO reports","Finding pages with weak titles","Finding pages where shoppers drop off"],"not_for":["Sales or customer files","Third-party hosted connectors without review"],"better":"","advice":"Exports are the safe first step. The GA MCP is a safe read-only experiment for later, set up on the company server so access details are saved centrally. Avoid third-party hosted connectors (Ryze, Porter Metrics, Open SEO MCP) until their terms are read.","confidentiality":"Search Console exports hold search phrases and page clicks, not customer identities: low risk on Claude Team or ChatGPT Business (no training by default). Google's GA MCP runs on your own computer or Google Cloud with read-only access; results go to whichever AI chat you connect, so use a business plan. Never mix in 1C turnover.","sources":["https://github.com/googleanalytics/google-analytics-mcp","https://www.enrichlabs.ai/blog/google-search-console-mcp-2026","https://claude.com/pricing","Library de1f3488d6"],"library_id":"de1f3488d6","lib_note":"In our library (card, not hands-on tested)","section":"seo","id":"ai-analysis-of-search-console-ga4-data-exports-first-google-"},{"name":"AI site-audit add-ons (jev-seo, Claude SEO)","url":"https://github.com/AgriciDaniel/jev-seo","category":"Free AI site audit","what":"Free add-ons that make Claude check a website against 50+ Google search rules and AI-search readiness, then produce a ranked fix list as PDF, Excel tracker and text report.","for_you":"A free first audit of italdizain.az to hand the website contractor. Our tests: jev-seo caught 9 of 11 planted faults with no false alarms in 5 seconds; Claude SEO caught 12 of 12. The catch: needs Claude Code (IT runs it), and scores are the model's own opinion.","verdict":"Try now","verdict_detail":"","safe_level":"amber","safe_line":"Public pages only, but jev-seo's AI judgments go to an outside service (TypeSafe Jev API).","effort":"15–30 min (IT)","price":"Free (~$0.01/site)","plan_and_price":"Free (MIT); jev-seo standard run about $0.01 per site in Jev credits; --full mode about $0.30 (DataForSEO).","readings":[{"value":"9 of 11","label":"planted faults caught by jev-seo, 0 false alarms"},{"value":"12 of 12","label":"planted faults found by Claude SEO"},{"value":"3 formats","label":"PDF, Excel tracker and text report"}],"try_before_friday":"Non-IT version: in a Claude Team chat, paste italdizain.az's robots.txt and the page source of one brand page and ask for an audit against Google's SEO basics and AI-search readiness, fixes by priority. IT version: run jev-seo's standard check on one public category page and bring the Excel tracker.","good_for":["A prioritised fix list for the web contractor","Re-checking after fixes"],"not_for":["Rankings or traffic data","Long-term reliance: one maintainer"],"better":"Screaming Frog for a full crawl; Semrush Site Audit if you buy Semrush.","advice":"Treat the output as a checklist, not a grade. Start with the cheap standard check; skip paid full mode. Our test ran without the Jev key, so the paid AI judgments are untested.","confidentiality":"It crawls public pages only; the free part runs on your machine. The AI judgments send page content to TypeSafe's Jev API, and the optional full mode uses DataForSEO; their training and retention terms are unknown, but this is public website content. No internal data is needed.","sources":["https://github.com/AgriciDaniel/jev-seo","https://github.com/AgriciDaniel/claude-seo","Library test 9840011542"],"library_id":"9840011542","lib_note":"Tested by us 12–13 Oct 2026","section":"seo","id":"ai-site-audit-add-ons-jev-seo-claude-seo"},{"name":"Ahrefs (Site Explorer + Brand Radar AI)","url":"https://ahrefs.com/pricing","category":"SEO suite + AI visibility","what":"Major SEO toolbox known for backlink and competitor data. Brand Radar shows how AI answers mention your brand.","for_you":"Excellent competitor and backlink research. The catch: its privacy policy (4 Aug 2026) lists training its machine-learning models as a purpose, with no opt-out described, and Brand Radar AI starts at $199/mo on top of a plan.","verdict":"Try for <X> only","verdict_detail":"public competitor and backlink research only, if the team prefers it to Semrush","safe_level":"amber","safe_line":"Policy lists ML training as a purpose. Public data only; never paste internal texts.","effort":"30 min to start","price":"From $29/mo","plan_and_price":"Starter $29/mo; Lite $129; Standard $249; Advanced $449; Enterprise $1,499 (yearly); Brand Radar AI from $199/mo.","readings":[{"value":"$199/mo","label":"Brand Radar AI add-on, from"},{"value":"US","label":"data storage"},{"value":"4 Aug 2026","label":"privacy policy date"}],"try_before_friday":"In the free Ahrefs Webmaster Tools or a trial, check italdizain.az's referring domains (other websites linking to it) and compare them with one Baku competitor.","good_for":["Backlink and competitor research","Finding sites worth PR outreach"],"not_for":["Internal drafts or briefs in its AI writer","Tight budgets"],"better":"Semrush, whose AI terms are clearer on no training.","advice":"Choose Semrush or Ahrefs, not both. If chosen, ask Ahrefs in writing whether AI Content Helper inputs are used for training.","confidentiality":"Data stored in the US. The policy says inputs to AI tools may pass to third-party AI providers, and lists training of its ML models as a purpose. Own SOC 2 / ISO 27001 status not confirmed. A DPA is published.","sources":["https://ahrefs.com/pricing","https://ahrefs.com/legal/privacy-policy","https://ahrefs.com/legal/data-processing-addendum-us"],"library_id":"","section":"seo","id":"ahrefs-site-explorer-brand-radar-ai"},{"name":"Microsoft Clarity with Copilot","url":"https://learn.microsoft.com/en-us/clarity/copilot/overview","category":"Website behaviour + AI","what":"Free Microsoft tool that records how visitors scroll and click on the website. Its Copilot summarises recordings and heatmaps in plain words.","for_you":"Shows why visitors leave brand or boutique pages, with no need to watch hours of recordings. The catch: it records real visitors, so set masking to strict and update the cookie notice.","verdict":"Try for <X> only","verdict_detail":"a 2–4 week pilot on the public website with strict masking, installed by the web contractor","safe_level":"amber","safe_line":"Records real visitor behaviour (personal data): strict masking and a privacy-notice update.","effort":"15 min to explore; 30 min contractor install","price":"Free","plan_and_price":"Free","readings":[{"value":"30 days","label":"recording retention"},{"value":"$0","label":"price"},{"value":"Strict","label":"masking setting to use from day one"}],"try_before_friday":"Read Microsoft's Copilot overview and list 3 questions the team would ask, e.g. 'Where do mobile visitors stop on the watches page?'. Decide whether the pilot is worth it.","good_for":["Finding confusing pages","Seeing what ad visitors do on the site"],"not_for":["Pages with personal forms","Use without a privacy-notice update"],"better":"","advice":"Turn on strict masking from day one and keep it off pages with forms. AI summaries can be wrong, as Microsoft's own page says.","confidentiality":"Data stored in Microsoft Azure, kept 30 days. Masked text is not uploaded. Microsoft says Clarity does not sell data. It records customer behaviour (personal data), so add it to the privacy notice; explicit consent required for EU/UK visitors. Company sign-in via Azure AD is not supported.","sources":["https://learn.microsoft.com/en-us/clarity/copilot/overview","https://learn.microsoft.com/en-us/clarity/faq"],"library_id":"","section":"seo","id":"microsoft-clarity-with-copilot"},{"name":"Meta Advantage+ creative and Ads Creative Studio","url":"https://www.facebook.com/business/help/297506218282224","category":"Built-in ad creative AI","what":"Switches inside Meta Ads Manager that let AI make extra versions of your ad: new backgrounds, wider crops, rewritten text, music, and short videos made from photos.","for_you":"Costs nothing extra and adds no new company, because your ads already go to Meta. The catch: AI edits can warp watches, jewellery and logos, and some switches turn themselves back on when you copy an ad.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Data goes only to Meta, which already holds your ads. Public ad material only.","effort":"20 min to start","price":"Free (ad spend only)","plan_and_price":"Free inside Ads Manager; you pay only for the ads. Video from still photos became generally available on 6 Oct 2026.","readings":[{"value":"Free","label":"no extra cost beyond ad spend"},{"value":"6 Oct 2026","label":"video-from-photos opened to all advertisers"},{"value":"One by one","label":"each AI switch must be checked before publishing"}],"try_before_friday":"In Ads Manager, start a draft ad (do not publish) using one public product photo from italdizain.az. Open the Advantage+ creative section and preview every enhancement. Screenshot each one and mark it keep or switch off according to whether it changed the product, logo or text. Bring the list on Friday.","good_for":["Testing more versions of one boutique ad without a new shoot","Turning 3–5 product photos into a short Reels video","Rewording ad text in several styles"],"not_for":["Hero images of watches and jewellery where one wrong detail hurts the brand","Ads the brand owner must approve pixel by pixel"],"better":"","advice":"Use it, with a team rule: one person checks every AI switch just before publishing. Copying, duplicating or changing the format of an ad can switch enhancements back on.","confidentiality":"Data goes only to Meta, which already holds your ads. Meta's public pages found do not say whether your uploaded creative trains its AI (unknown). Retention follows Meta's normal advertising terms. Only ad material meant for the public goes in. Never put turnover, margins or customer names into ad text prompts.","sources":["https://www.facebook.com/business/help/297506218282224","https://www.relevantaudience.com/meta/meta-advertising-week-new-york-2026-ad-tools/","https://www.jumpfly.com/blog/metas-advantage-settings-why-they-keep-reappearing-and-how-to-stay-in-control/","https://searchengineland.com/meta-launches-ai-powered-ad-creativity-tools-440316"],"library_id":"","section":"ads","id":"meta-advantage-creative-and-ads-creative-studio"},{"name":"Meta AI business assistant (in Ads Manager)","url":"https://mediapost.com/publications/article/414547/meta-rolls-out-ai-business-assistant-to-all-advert.html","category":"Ad reporting assistant","what":"A chat helper inside Ads Manager and Meta Business Suite. You ask questions about your campaigns in plain words and it explains results and suggests fixes.","for_you":"Quick answers like 'why did cost per message rise this week?' without exporting anything, and the data never leaves Meta. The catch: still a beta, and actions that change campaigns are only in testing.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Questions and answers stay inside Meta; don't type customer names or turnover totals.","effort":"10 min to start","price":"Free","plan_and_price":"Free inside Ads Manager. Beta opened to advertisers worldwide in April 2026. Agentic actions, scheduled tasks and memory still in test as of 6 Oct 2026.","readings":[{"value":"Free","label":"part of Ads Manager"},{"value":"Beta","label":"answers live; changing campaigns still in test"},{"value":"Apr 2026","label":"opened worldwide"}],"try_before_friday":"Each person asks the assistant the same three questions about one live campaign: 'Which ad had the lowest cost per result in the last 30 days and why?', 'What should I change first?' and 'Is anything under-delivering?' Check one answer against the numbers in Ads Manager.","good_for":["Weekly 'what changed and why' questions","Spotting an ad that suddenly costs more","Learning Ads Manager faster"],"not_for":["Making changes without a person checking","Reports that combine Meta with Google or the website"],"better":"","advice":"A good, safe first step, because nothing leaves Meta. Treat its advice as a junior analyst's: check the numbers before acting. Meta's free automated rules in Ads Manager cover most 'pause if too expensive' needs without a third-party tool.","confidentiality":"Questions and answers stay inside Meta, which already holds the ad data; no new company involved. Meta does not say publicly whether these chats train its AI (unknown). Do not type turnover totals, customer names or phone numbers.","sources":["https://mediapost.com/publications/article/414547/meta-rolls-out-ai-business-assistant-to-all-advert.html","https://www.exchange4media.com/industry-briefing-news/meta-expands-ai-business-assistant-to-global-advertisers-154139.html","https://www.relevantaudience.com/meta/meta-advertising-week-new-york-2026-ad-tools/"],"library_id":"","section":"ads","id":"meta-ai-business-assistant-in-ads-manager"},{"name":"Google Ads AI: AI Max, Performance Max assets, Asset Studio and Ask Advisor","url":"https://business.google.com/us/accelerate/announcements/ai-max-for-search-campaigns/","category":"Built-in search ad AI","what":"Google's AI inside Google Ads. It finds extra search phrases, rewrites ads to match each search, makes images and short videos from your website (Asset Studio, Gemini Omni video), and has a chat helper.","for_you":"Free and already part of Google Ads; Google reports about 7% more conversions with AI Max. The catch: English-first. Ask Advisor and Asset Studio video are English-only, and the AI that writes ads from your website does not work for Azerbaijani or Russian pages.","verdict":"Try for <X> only","verdict_detail":"English-language campaigns and English landing pages","safe_level":"green","safe_line":"Data goes only to Google, which already runs your ads. Public website and ad text only.","effort":"30 min to start","price":"Free (clicks only)","plan_and_price":"Free inside Google Ads; you pay for clicks. AI Max left beta April 2026. Ask Advisor announced 20 May 2026 (English beta). Asset Studio video free for all advertisers (English only).","readings":[{"value":"+7%","label":"more conversions, Google's own figure"},{"value":"7 languages","label":"for AI asset writing: EN, NL, FR, DE, IT, PT, ES (no AZ or RU)"},{"value":"0","label":"videos we could make in our test (needs a live Ads account)"}],"try_before_friday":"Whoever holds the Google Ads login: open Asset Studio and generate 5 images and one draft video from an English product page on italdizain.az. Save as drafts only, and check product, logo and colours by eye. Then note whether one Search campaign is on the AI Max upgrade list.","good_for":["English campaigns aimed at tourists and expats","Quick product images and videos for Performance Max","Finding search phrases you missed"],"not_for":["Azerbaijani or Russian ad text written by Google's AI","Luxury brand visuals without human review"],"better":"","advice":"Use it for English campaigns. For Azerbaijani and Russian ads, draft the text in Claude or ChatGPT and paste it in yourself. Review automatic upgrades: Google is moving old search settings into AI Max.","confidentiality":"Data goes only to Google, which already runs your ads. Google's help page on AI-made assets does not say whether inputs train its models and gives no retention period (unknown). Outputs carry a SynthID watermark. Inputs are your public website and ad text, so risk is low. Never paste sales figures into prompt boxes.","sources":["https://business.google.com/us/accelerate/announcements/ai-max-for-search-campaigns/","https://support.google.com/google-ads/answer/14150602?hl=en","https://ppc.land/googles-ask-advisor-unifies-ads-analytics-and-commerce-in-one-ai-agent/","https://alternativeto.net/news/2026/8/google-ads-integrates-gemini-omni-for-video-creation-and-editing/","Library test 0e6a8d313e (Asset Studio, 13 Oct: could not run without an account)"],"library_id":"0e6a8d313e","lib_note":"In our library: test attempted, needs a live Ads account","section":"ads","id":"google-ads-ai-ai-max-performance-max-assets-asset-studio-and"},{"name":"Meta Ads AI Connectors (official link from Claude or ChatGPT to Meta ads)","url":"https://www.facebook.com/business/help/1456422242197840","category":"Official ad data connector","what":"Meta's own official link (an MCP) that lets Claude, ChatGPT or Perplexity read your Facebook and Instagram ad results and, if you allow it, prepare campaigns. Prepared campaigns arrive as drafts in Ads Manager.","for_you":"Weekly ad reports and 'what worked' summaries in minutes, with Meta's own login and no middleman company. The catch: the ad numbers, including sales value, travel to the AI, so you need a business AI plan, and it can also change live campaigns.","verdict":"Try for <X> only","verdict_detail":"read-only weekly reporting, by one named person, from a business AI workspace","safe_level":"amber","safe_line":"Ad numbers (incl. sales value) go to the AI you connect: business plan and read-only only.","effort":"20 min with the ad account admin","price":"Free (beta)","plan_and_price":"Free during open beta (since 29 Apr 2026, widened 16 Jul 2026). Needs an AI plan that allows custom connectors.","readings":[{"value":"29 Apr 2026","label":"open beta launched"},{"value":"29","label":"tools across reporting, campaigns, catalog, accounts"},{"value":"Drafts","label":"agent work lands as a draft in Ads Manager"}],"try_before_friday":"Without connecting anything: make a fake 20-row spreadsheet of campaigns (made-up spend, clicks and messages; no revenue column). Ask Claude or ChatGPT to turn it into a one-page weekly report in Russian with 3 actions. If the team likes it, that is what the connector would automate later.","good_for":["Weekly cross-campaign summaries in Russian or Azerbaijani","Drafting a campaign that a person then reviews in Ads Manager"],"not_for":["Anyone on a personal or free AI plan","Letting an agent change budgets unsupervised","Accounts holding customer upload lists until terms are clear"],"better":"","advice":"The right way to link AI to Meta ads, far better than third-party connectors. Start read-only, with one person, on a business AI plan, and set the business-portfolio rules first.","confidentiality":"Data travels from Meta to whichever AI you connect. On Claude Team or Enterprise it is not used for training and kept 30 days by default; on personal Claude Free, Pro or Max it may be used if Model Improvement is on. Sources disagree on permissions: some report read-only, read/write and read/write/financial levels; another says scopes are auto-granted and write actions have no undo. Limit consent to one business portfolio. A portfolio admin can set rules limiting what agents may do. Meta does not describe retention or training for connector data (unknown).","sources":["https://www.facebook.com/business/news/meta-ads-ai-connectors","https://www.facebook.com/business/help/1456422242197840","https://ppc.land/meta-opens-ads-mcp-to-any-app-cutting-integration-code-to-zero/","https://pasqualepillitteri.it/en/news/1707/official-meta-ads-mcp-claude-29-tools-2026","https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training"],"library_id":"","section":"ads","id":"meta-ads-ai-connectors-official-link-from-claude-or-chatgpt-"},{"name":"Supermetrics (AI chats and MCP connector)","url":"https://supermetrics.com/products/supermetrics-mcp","category":"Cross-channel report connector","what":"An established reporting service that pulls Meta, Google, TikTok and Analytics numbers together. You can then ask about them in ChatGPT, Claude or Microsoft Copilot.","for_you":"One place to ask 'how did all channels do last month?', and it works with Copilot, which suits a Microsoft 365 company. The catch: a third company now sees the numbers, and plans start at €49 a month.","verdict":"Try for <X> only","verdict_detail":"monthly cross-channel reporting, after reading its security pack and signing its DPA","safe_level":"amber","safe_line":"Third party in the data path; vendor states SOC 2 + ISO 27001 and no training. Get the DPA first.","effort":"30 min to start","price":"From €49/mo","plan_and_price":"Starter €49/month (€39 yearly; 2 sources, 1 user), Growth €199/month (€159 yearly; 7 sources, 2 users), Enterprise custom. Starter and Growth include one AI chat destination. Full MCP/API appears to be Enterprise. 14-day free trial.","readings":[{"value":"€49/mo","label":"entry plan"},{"value":"SOC 2 + ISO 27001","label":"vendor-stated certificates"},{"value":"14 days","label":"free trial, no card"}],"try_before_friday":"Start the free trial and connect only Google's public demo Analytics account (the 'Google Merchandise Store' demo property), not Italdizain's accounts. Ask the AI chat for a channel summary and judge the format.","good_for":["One monthly report across Meta, Google and TikTok","Asking Copilot or Claude questions about all channels at once"],"not_for":["A team that only runs Meta ads (use Meta's own tools)","Sharing revenue with an outside party before the DPA is signed"],"better":"","advice":"The most mature of the outside reporting tools. Ask for its SOC 2 report and DPA before connecting real accounts.","confidentiality":"Data flows from the ad platforms through Supermetrics to your chosen AI. Supermetrics says it is SOC 2 Type II and ISO 27001 certified, does not store raw ad data (queries platforms on demand), and does not use customer data to train public models. Regional hosting 'available' but locations not stated. Vendor claims: ask for the reports. The AI side must be a business plan.","sources":["https://supermetrics.com/products/supermetrics-mcp","https://supermetrics.com/pricing","https://docs.supermetrics.com/docs/supermetrics-mcp-server"],"library_id":"","section":"ads","id":"supermetrics-ai-chats-and-mcp-connector"},{"name":"TikTok Symphony (Creative Studio, Assistant, Smart+)","url":"https://ads.tiktok.com/business/en-US/blog/tiktok-symphony-ai-creative-suite","category":"Built-in video ad AI","what":"TikTok's own AI for advertisers. It turns product photos or a link into short TikTok videos, adds stock AI presenters, translates voice-overs and writes scripts.","for_you":"Fast TikTok-style video drafts from existing product photos, reported as free. The catch: whether your uploads train TikTok's AI is unclear, and Russian or Azerbaijani voice support is unconfirmed.","verdict":"Try for <X> only","verdict_detail":"TikTok video drafts from public product photos only, if the team runs TikTok ads","safe_level":"amber","safe_line":"TikTok's general terms allow ML training on content. Public product material only.","effort":"20 min to start","price":"Reported free","plan_and_price":"Reported free for advertisers (not confirmed on a TikTok pricing page). Seedance 2.0 video model added in 2026. Custom avatars only for select advertisers.","readings":[{"value":"Free","label":"reported; not confirmed by TikTok"},{"value":"30+","label":"languages for stock AI presenters (Russian not confirmed)"},{"value":"Unclear","label":"whether advertiser uploads train TikTok's AI"}],"try_before_friday":"Take 4 public product photos of one vase or tableware set from italdizain.az. In Symphony Creative Studio, make one 15-second draft video. Check whether a Russian or Azerbaijani voice-over is offered. Do not publish.","good_for":["Quick vertical videos for décor, tableware and textiles","Testing hooks before paying for a shoot"],"not_for":["Fine jewellery or watch close-ups that must be exact","Anything with customers' faces"],"better":"","advice":"Worth a test if TikTok is a real channel. Keep it to public product material, and check first that self-serve TikTok ads work for an Azerbaijan account.","confidentiality":"Uploads go to TikTok (ByteDance). TikTok's general terms let it use content to train its machine-learning models. Symphony-specific advertiser terms on training were not found (unknown). Never upload customer photos, client lists or internal price lists.","sources":["https://ads.tiktok.com/business/en-US/blog/tiktok-symphony-ai-creative-suite","https://www.techradar.com/pro/tiktok-makes-its-ai-ad-creation-tool-available-to-all-advertisers","https://www.vidjet.com/blog/latest-features-on-tiktok-symphony-studio-july-2026-update","https://conductatlas.com/platform/tiktok/tiktok-terms-of-service/content-license-for-ai-training/"],"library_id":"","section":"ads","id":"tiktok-symphony-creative-studio-assistant-smart"},{"name":"Pencil (AI ad generator by Brandtech)","url":"https://www.trypencil.com/pricing","category":"AI ad variant maker","what":"An online tool that makes many ad image, text and video versions from your product and brand material, and predicts which may work best.","for_you":"A cheap way to test whether AI ad variants look good enough for Italdizain brands. The catch: the written 'no training on your data' promise is only on the expensive Pro plan.","verdict":"Try for <X> only","verdict_detail":"testing ad variants from public product photos on the Core plan","safe_level":"amber","safe_line":"'No train' terms only on Pro; on Core/Growth use public product photos only.","effort":"30 min to start","price":"From $14/mo","plan_and_price":"Core $14/month ($11 yearly, 50 generations), Growth $55/month ($44 yearly, 250 generations), Pro custom (unlimited, enterprise terms). Unused generations do not roll over.","readings":[{"value":"$14/mo","label":"entry plan"},{"value":"50","label":"generations a month on Core"},{"value":"Pro only","label":"written 'no train' terms"}],"try_before_friday":"Take one public product photo and the brand's public logo. Generate 5 Instagram ad variants on the cheapest plan or trial. Score each 1–5 for 'would the brand owner approve this?' and bring the scores.","good_for":["Making 10 versions of one banner to test","Seeing what AI-made ads look like for a luxury brand"],"not_for":["Unreleased collections or price lists on Core","Creator-style talking-head videos"],"better":"AdCreative.ai is the main rival, but no security page or privacy policy could be found on its homepage (13 Oct), so Pencil comes first.","advice":"Good for a cheap quality test. If the team adopts it for real campaigns, move to Pro with the no-train terms in the contract.","confidentiality":"Uploads go to Pencil, which uses several AI models. 'No train' terms, data ring-fencing and role-based access are listed for Pro only; Core and Growth training position not stated (unknown). Pencil publishes a DPA, a sub-processor list and an AI Trust Centre. No SOC 2 or ISO named on the pricing page.","sources":["https://www.trypencil.com/pricing","https://superscale.ai/alternatives/pencil/review","https://www.adcreative.ai/"],"library_id":"","section":"ads","id":"pencil-ai-ad-generator-by-brandtech"},{"name":"Claude Ads (free ad-audit add-on)","url":"https://github.com/AgriciDaniel/claude-ads","category":"Ad account checker","what":"A free Claude Code add-on that reads exported reports from Meta, Google, TikTok and other ad platforms and writes a scored audit. It only reads and changes nothing.","for_you":"A second opinion on wasted spend from an export file, with no outside company connected to the account. The catch: someone technical must install it (needs Python 3.11+), and the export still goes to Claude.","verdict":"Worth a look later","verdict_detail":"","safe_level":"amber","safe_line":"Runs locally; the export goes to Claude. Delete revenue columns and customer data first.","effort":"20 min to set up (needs IT)","price":"Free","plan_and_price":"Free (MIT); needs a Claude plan and Python 3.11 or 3.12.","readings":[{"value":"~30","label":"ad topics covered (platforms, budgets, reports)"},{"value":"Read-only","label":"by default; changes need approval"},{"value":"Not run","label":"our partial test 12 Oct: the Mac's Python was too old"}],"try_before_friday":"Not a team task. Huseyn or IT can run it once on a made-up export (fake spend and clicks, no revenue, campaign names replaced by codes) and show the audit on Friday.","good_for":["Checking a Meta or Google export for wasted spend","Ads the team runs itself"],"not_for":["Ads run by an agency that gives no exports","Connecting live ad accounts"],"better":"","advice":"Our test (12 Oct): downloaded and read, careful design (it builds a data report first and never claims a platform it has no data for), but no audit run yet. Try it after Python 3.11+ is installed, read-only, with money columns removed.","confidentiality":"The tool runs on your own computer. The export is read by Claude, so it follows your Claude plan's rules: Team or Enterprise, no training and 30-day retention; personal plans, possible training if Model Improvement is on. Ad spend and results are commercially sensitive: remove conversion-value/revenue columns and anything naming customers.","sources":["https://github.com/AgriciDaniel/claude-ads","https://code.claude.com/docs/en/data-usage","Library test aaebfeb454 (partial, 12 Oct 2026)"],"library_id":"aaebfeb454","lib_note":"Partially tested by us 12 Oct 2026","section":"ads","id":"claude-ads-free-ad-audit-add-on"},{"name":"Google Ads MCP server (official, read-only)","url":"https://developers.google.com/google-ads/api/docs/developer-toolkit/mcp-server","category":"Official ad data connector","what":"Google's own free link that lets Claude or another AI read Google Ads campaign numbers. It cannot change bids, pause campaigns or create ads.","for_you":"A safe, read-only way for Claude to answer Google Ads questions. The catch: not click-to-connect. Someone must set up a Google Cloud project and run it.","verdict":"Worth a look later","verdict_detail":"","safe_level":"amber","safe_line":"Read-only and self-run; results go to the AI you connect, so a business plan only.","effort":"1–2 hours (IT)","price":"Free","plan_and_price":"Free (Apache-2.0). Needs a Google Cloud project with Google Ads API access and OAuth. Developer tokens retired 9 Sep 2026. Page updated 30 Sep 2026.","readings":[{"value":"Read-only","label":"cannot change anything"},{"value":"Free","label":"open source by Google"},{"value":"30 Sep 2026","label":"page last updated"}],"try_before_friday":"Read Google's page (10 min) and list what IT would need: a Cloud project, API access and an OAuth login. Decide on Friday whether it is worth Huseyn's server time.","good_for":["Letting Claude answer Google Ads questions on the automation server","Weekly Google Ads summaries"],"not_for":["Marketers setting it up alone","Making changes to campaigns"],"better":"Google's built-in Ask Advisor if the team works in English; or simply export a report and give it to the AI.","advice":"The official and safest Google route, a good fit for Huseyn's automation server later. Confirm first who owns the Google Ads account.","confidentiality":"You run it yourself (on a computer or your own Google Cloud). Google's repo says it exposes your data to the AI you connect, so the AI must be a business plan. It adds a header to API calls that Google uses to improve the product. Read-only, so it cannot damage campaigns.","sources":["https://developers.google.com/google-ads/api/docs/developer-toolkit/mcp-server","https://github.com/googleads/google-ads-mcp"],"library_id":"","section":"ads","id":"google-ads-mcp-server-official-read-only"},{"name":"Ryze Ads MCP (third-party Google + Meta connector)","url":"https://github.com/irinabuht12-oss/google-ads-meta-ads-mcp","category":"Ad data connector","what":"A paid online service from a small startup that lets Claude or ChatGPT read Google Ads, Meta Ads and Google Analytics after you sign in.","for_you":"One connector for both Google and Meta. The catch: a young outside company sits between your ad accounts and the AI, and its own description contradicts itself on what it stores.","verdict":"Skip","verdict_detail":"","safe_level":"red","safe_line":"Contradictory claims about storing your data and tokens; no certificates.","effort":"15 min","price":"~$89/mo","plan_and_price":"About $89/month after a 7-day trial.","readings":[{"value":"$89/mo","label":"after the 7-day trial"},{"value":"2 people","label":"contribute, despite 4,500 stars"},{"value":"Contradictory","label":"claims about storing your data"}],"try_before_friday":"Do not connect. If asked about it on Friday, point to the official Meta and Google connectors instead.","good_for":["Nothing the official connectors cannot do"],"not_for":["Any real Italdizain ad account"],"better":"Meta Ads AI Connectors and Google's official Google Ads MCP server.","advice":"Skip. Use the official Meta and Google connectors. The same applies to Madgicx (privacy policy from Jan 2023, no certificates, hidden prices).","confidentiality":"Ad data passes through Ryze's hosted service. Our library check found the README contradicts itself on data and token storage ('stores nothing' versus tokens on your machine) and on read-only versus read-and-write. No certificates found.","sources":["https://github.com/irinabuht12-oss/google-ads-meta-ads-mcp","https://www.facebook.com/business/news/meta-ads-ai-connectors","https://madgicx.com/privacy-policy","Library a2dd58e6ea"],"library_id":"a2dd58e6ea","lib_note":"Checked by us (repo review)","section":"ads","id":"ryze-ads-mcp-third-party-google-meta-connector"},{"name":"Sprout Social (Trellis AI and AI Assist)","url":"https://sproutsocial.com/pricing/","category":"All-in-one social suite","what":"One place to plan and publish posts, answer comments and DMs from every network, and see reports. Built-in AI drafts posts and replies and summarises what people say.","for_you":"The safest big suite on paper, with the strongest certificates. Good for several people across many brand accounts. The catch: expensive per seat, and Sprout may use AI inputs to improve its own AI.","verdict":"Try now","verdict_detail":"","safe_level":"amber","safe_line":"OpenAI may not train on it, but Sprout itself may; OpenAI features can be switched off.","effort":"30 min to start a trial","price":"From $79/seat/mo","plan_and_price":"Per seat per month: Essentials $79 yearly or $99 monthly; Standard $199, Professional $299, Advanced $399 (annual billing shown). Enterprise custom. AI reply drafting from Advanced. Listening is an add-on from Standard. Checked 13 Oct 2026.","readings":[{"value":"SOC 2 + ISO 27001/27701","label":"certificates"},{"value":"OpenAI","label":"AI provider (can be switched off)"},{"value":"$79","label":"per seat per month, billed yearly"}],"try_before_friday":"Start the free trial and connect one test Instagram account (not the main brand). Write three made-up posts about a fictional tableware launch and use 'Enhance by AI Assist' to rewrite each in a luxury tone. Then open Settings > AI Settings and check the switch to turn OpenAI features off is there.","good_for":["Shared inbox for Instagram, Facebook and TikTok comments and DMs","Approval workflows before posting","Reports for management"],"not_for":["Anything containing sales figures or client identities","Small budgets: the cost is per seat"],"better":"Metricool if the budget is small. Hootsuite is a close rival (SOC 2 Type II, ISO 27001/27017/27701, from $99/user) with the same 'vendor may use your AI inputs' clause.","advice":"Shortlist it. Before buying, ask for the DPA, the AI policy, an opt-out from Sprout's own training, and EU data hosting (none is stated).","confidentiality":"Data processed in the USA (AWS, Google Cloud backups). Generative AI runs on OpenAI. Sprout's AI terms (7 Jul 2026) say providers may not train on your content, but Sprout itself 'may use the AI Content to train, develop, and improve the AI Features'. OpenAI features are on by default; the account owner can switch them off in AI Settings. SOC 2 Type II, ISO 27001:2022 and ISO 27701, GDPR, DPA available. Retention of AI inputs not stated. Hootsuite's AI terms (29 Jul 2025) are similar: third-party providers may not train, Hootsuite may use content to improve its own AI.","sources":["https://sproutsocial.com/pricing/","https://sproutsocial.com/legal/ai-features-terms/","https://trust.sproutsocial.com/","https://support.sproutsocial.com/hc/en-us/articles/37427724658189-Your-Data-and-Our-AI-A-Transparent-Look-at-How-We-Innovate-Responsibly","https://www.hootsuite.com/legal/ai-terms","https://www.hootsuite.com/legal/ai-provider-list"],"library_id":"","section":"social","id":"sprout-social-trellis-ai-and-ai-assist"},{"name":"Meta Business Agent (WhatsApp Business, Instagram, Messenger)","url":"https://whatsappbusiness.com/resources/resource-library/meta-business-agent-whatsapp/","category":"DM auto-replies","what":"Meta's own free AI that answers customers in WhatsApp and Instagram DMs. It learns from your past chats, website, catalogue and documents, and hands over to a person when needed.","for_you":"It works where Baku clients already write, at no cost. The catch: Meta can see these chats and may use them to improve its AI, so it should only ever be taught public information.","verdict":"Try for <X> only","verdict_detail":"test mode on a spare WhatsApp Business number, taught only with the public website and catalogue","safe_level":"red","safe_line":"Meta sees the chats and may use them to improve its AI; setup can learn from old client chats.","effort":"20 min in test mode","price":"Free for now","plan_and_price":"Free to start, including on Instagram. Meta says paid tiers are coming in WhatsApp Business Premium; large businesses will pay per use. Prices not published as of 13 Oct 2026.","readings":[{"value":"3 Jun 2026","label":"launched globally"},{"value":"Yes","label":"Meta sees chats, per Meta's own page"},{"value":"Unknown","label":"Azerbaijani quality"}],"try_before_friday":"On a spare phone with a test WhatsApp Business number, open Tools > Meta Business Agent. Add only italdizain.az and a made-up five-product catalogue. Stay in test mode and ask it ten typical client questions in Azerbaijani, Russian and English (opening hours, gift wrapping, 'do you have Bernardaud?'). Count correct, on-brand answers.","good_for":["Answering routine questions after hours","Learning what clients ask most often"],"not_for":["VIP or private-client conversations","Anything about prices, discounts or orders tied to a named client"],"better":"respond.io or BSPK for a controlled business inbox with contracts.","advice":"The team should see it, because competitors will use it. Keep it in test mode until Huseyn decides. Check whether Azerbaijani works well; no source confirms it.","confidentiality":"Meta's transparency page (30 Jul 2025) says these chats 'will be visible to you, the business and Meta' and 'Your feedback and messages may be used to improve AI at Meta'. Setup can learn from your past chats, so turning it on can expose old client conversations to the AI. Retention and data location not stated. Never upload price lists with margins, client lists, stock or turnover files.","sources":["https://about.fb.com/news/2026/06/meta-business-agent/","https://whatsappbusiness.com/resources/resource-library/meta-business-agent-whatsapp/","https://transparency.meta.com/en-us/policies/other-policies/business-chats-using-ai-from-meta","https://techcrunch.com/2026/06/03/metas-ai-agent-for-whatsapp-business-is-now-available-globally/"],"library_id":"","section":"social","id":"meta-business-agent-whatsapp-business-instagram-messenger"},{"name":"Metricool","url":"https://metricool.com/pricing/","category":"Scheduling and analytics","what":"A Spanish tool that plans and publishes posts, shows analytics, compares you with up to 100 competitor accounts, and includes an AI assistant and automatic comment and DM replies.","for_you":"Cheap and priced per brand rather than per person, which suits many Italdizain brands. The free plan lets the team try it today. The catch: which AI it uses, and whether it trains on your content, is not published.","verdict":"Try now","verdict_detail":"","safe_level":"amber","safe_line":"EU company with a DPA, but AI provider and training not published. Public content only.","effort":"15 min to start","price":"Free; from €16/mo","plan_and_price":"Free: 1 brand, 5 AI credits/month. Starter from €16/month yearly (€20 monthly) for 5 brands. Advanced from €43/month yearly for 15 brands, up to €130 for 50 brands. Checked 13 Oct 2026.","readings":[{"value":"Yes, 1 brand","label":"free plan"},{"value":"Up to 100","label":"competitor accounts tracked (paid)"},{"value":"Madrid","label":"company base (EU)"}],"try_before_friday":"Create a free account and connect one test Instagram account. Add five public competitor accounts (e.g. other Baku luxury boutiques) and look at the competitor report. Use the AI assistant to write three captions for a made-up watch event in Russian and English.","good_for":["Many brand accounts on a small budget","Competitor benchmarking","Quick start without IT"],"not_for":["Large teams needing strict approval chains","Any internal figures in AI prompts"],"better":"Sprout Social if certificates and approval workflows matter more than price.","advice":"Email legal@metricool.com before Friday asking which AI provider it uses, whether inputs are used for training, and where data is stored. Get the DPA if the team likes it.","confidentiality":"Metricool Software S.L. (Madrid) acts as a GDPR processor and signs a DPA on request at legal@metricool.com. The DPA does not name AI providers or say where data is stored. No public statement on AI training, AI retention or security certificates.","sources":["https://metricool.com/pricing/","https://help.metricool.com/data-processing-agreement-dpa-8vc0d.md","https://www.iubenda.com/app/privacy-policy/33582008"],"library_id":"","section":"social","id":"metricool"},{"name":"Buffer (AI Assistant)","url":"https://buffer.com/pricing","category":"Simple scheduling","what":"A simple, cheap tool to schedule posts, with an AI Assistant that rewrites and repurposes posts and suggests replies to comments.","for_you":"The easiest way for each marketer to try AI post writing today, for free. The catch: data sits in the USA with OpenAI and Anthropic as AI suppliers, and Buffer does not say whether it trains on content.","verdict":"Try now","verdict_detail":"","safe_level":"amber","safe_line":"US hosting, content kept indefinitely, no training statement. Post drafts only.","effort":"15 min","price":"Free; $5/channel/mo","plan_and_price":"Free: up to 3 channels, AI Assistant included, 5 AI reply suggestions per week. Essentials $5 per channel per month. Team $10 per channel per month, unlimited users. Checked 13 Oct 2026.","readings":[{"value":"3 channels","label":"free plan"},{"value":"OpenAI, Anthropic","label":"AI suppliers (USA)"},{"value":"Indefinite","label":"content retention while account is active"}],"try_before_friday":"Open a free account (3 channels) with a test Instagram account. Paste a made-up product description of a silk table runner. Ask the AI Assistant for three Instagram versions and one shorter TikTok caption, then compare with what the team would write.","good_for":["Learning AI caption writing at no cost","Small brand accounts"],"not_for":["Shared inbox for many staff","Anything confidential"],"better":"Metricool, which also has a free plan and is EU-based.","advice":"Good as a personal sandbox for learning AI post writing. For company-wide use, prefer a tool with published certificates.","confidentiality":"Buffer's sub-processor list names OpenAI and Anthropic for AI, plus AWS and MongoDB Atlas for hosting, all in the USA. User content is stored 'indefinitely' while the account is active and deleted with the account. No statement found on AI training or SOC 2.","sources":["https://buffer.com/pricing","https://buffer.com/security"],"library_id":"","section":"social","id":"buffer-ai-assistant"},{"name":"YouScan (Insights Copilot, Visual Insights)","url":"https://youscan.io/blog/starter-3-affordable-pricing-plan/","category":"Social listening","what":"Tracks public posts and comments that mention your brands or competitors, recognises logos in photos, and lets you ask questions about the results in plain language.","for_you":"Shows what Baku shoppers say about Italdizain's brands and competitors, including in photos. The catch: Azerbaijani coverage is unconfirmed, and it is unclear whether its AI assistant uses ChatGPT.","verdict":"Try for <X> only","verdict_detail":"a paid pilot on 3 public topics, after confirming Azerbaijani and Russian coverage","safe_level":"amber","safe_line":"Works on public social data; AI provider unclear. Upload no internal files.","effort":"30 min demo","price":"From $299/mo","plan_and_price":"Starter 3: $299 per month for 3 topics and 30,000 mentions, with Insights Copilot (vendor blog, 27 Jan 2026; third-party sites still show $499). Visual Insights add-on. Larger plans custom.","readings":[{"value":"$299/mo","label":"entry price (vendor blog, Jan 2026)"},{"value":"Netherlands","label":"Microsoft hosting (self-reported)"},{"value":"Unconfirmed","label":"Azerbaijani coverage"}],"try_before_friday":"Book a demo and ask them to show a live search on 'Italdizain' and two competitor names in Azerbaijani and Russian, plus logo recognition on a luxury brand. Note how many real local posts appear.","good_for":["Brand reputation tracking","Competitor monitoring","Spotting logos in user photos"],"not_for":["Publishing or replying","Internal data"],"better":"Brandwatch for an enterprise option with clearer AI rules.","advice":"Ask in writing about Azerbaijani coverage, the Copilot's AI provider and the DPA.","confidentiality":"Works on public social data, so risk is low if no internal files are uploaded. A self-reported Slack listing says data is hosted by Microsoft in a Netherlands data centre and kept for the life of the account. GDPR badge and DPA link on the site. Whether Insights Copilot sends data to OpenAI is unclear (reviews say 'powered by ChatGPT'; the Slack listing says no LLM). No SOC 2 or ISO found.","sources":["https://youscan.io/blog/starter-3-affordable-pricing-plan/","https://www.youscan.io","https://slack.com/marketplace/A7JQ52C03-youscan","https://youscan.io/en/license"],"library_id":"","section":"social","id":"youscan-insights-copilot-visual-insights"},{"name":"Brandwatch (Consumer Research, Iris AI)","url":"https://www.brandwatch.com/legal/artificial-intelligence-faqs/","category":"Social listening","what":"An enterprise social listening and management platform. Its AI ('Iris') summarises conversations, writes searches and drafts posts.","for_you":"Has the clearest written AI rules in this group, but is priced for large companies with no public price. Its 7-question AI FAQ is the best checklist for questioning every other vendor.","verdict":"Worth a look later","verdict_detail":"","safe_level":"amber","safe_line":"Third-party AI may not train and keeps data ≤30 days; own-model training not stated.","effort":"5 min reading, then a demo if needed","price":"On request","plan_and_price":"Not published; custom quote after a demo (checked 13 Oct 2026).","readings":[{"value":"Not allowed","label":"third-party AI training on your data"},{"value":"≤30 days","label":"AI vendor retention"},{"value":"ISO 27001:2022","label":"all products"}],"try_before_friday":"Read the 7-question AI FAQ (5 min) and use it as the checklist for every other vendor: which AI providers, do they train, how long is data kept, can we opt out, how do we delete.","good_for":["Deep listening","A model checklist for AI privacy questions"],"not_for":["A small team's first tool"],"better":"YouScan for a cheaper pilot.","advice":"Use its AI FAQ as the standard to measure the others against (Smartly's security page is a similar yardstick for ad tools: ISO 27001, EU storage, DPA, access logs, deletion at contract end). Ask for a quote only if YouScan's local coverage disappoints.","confidentiality":"Brandwatch's AI FAQ: third-party vendors (OpenAI, Gemini, Speechify) are optional, may not train on customer data, and keep data up to 30 days; an admin can switch them off. In-house AI uses its own models; whether Brandwatch trains them on customer data is not stated. ISO 27001:2022. Social Media Management hosted on AWS and GCP in the EU; Listening in the US and UK, public data only.","sources":["https://www.brandwatch.com/legal/artificial-intelligence-faqs/","https://www.brandwatch.com/legal/information-security/","https://www.smartly.io/security"],"library_id":"","section":"social","id":"brandwatch-consumer-research-iris-ai"},{"name":"BSPK (luxury clienteling with AI agents)","url":"https://www.bspk.com","category":"Client follow-up (clienteling)","what":"A clienteling app for boutique advisors. It joins store, web and stock data into one client profile, and AI drafts personal WhatsApp, SMS and e-mail messages that the advisor approves before sending.","for_you":"Built for brands like Hermès and Christofle, so it fits Italdizain's 26 boutiques. The catch: it would hold real client data, there is no public price, and its privacy policy is unfinished.","verdict":"Try for <X> only","verdict_detail":"a vendor demo on BSPK's own demo data; no Italdizain client data before a DPA and security review","safe_level":"amber","safe_line":"Would hold real client data: only after a signed DPA and security review. Demo data only now.","effort":"30 min to book and prepare a demo","price":"Not published","plan_and_price":"Not published. AI included in every plan from Boutique to Enterprise (vendor press release, 1 Sep 2026). Demo only.","readings":[{"value":"Every message","label":"approved by a person (our test)"},{"value":"Not published","label":"price"},{"value":"USA / EEA?","label":"data location (unconfirmed)"}],"try_before_friday":"Watch the product pages and book a demo. Prepare five questions: price for about 26 boutiques, whether WhatsApp uses the official Business API, whether it connects to 1C, where data is stored, and whether our data trains their AI.","good_for":["VIP client follow-up by boutique advisors","Personal outreach on WhatsApp with approval"],"not_for":["Mass marketing","A trial with real client data before a contract"],"better":"Tulip clienteling AI (library c77953d765) is the main alternative to compare; also Salesfloor.","advice":"Shortlist BSPK with Tulip and Salesfloor; ask each for a 26-boutique quote, a reference customer in the region and a WhatsApp demo. Do not accept the 'two-week go-live' claim without proof.","confidentiality":"The one category where real client data would go in, so it needs a contract. Privacy policy (June 2026): BSPK acts as GDPR processor; data 'generally stored in the United States', possibly in the EEA for EEA customers. The published page still contains an internal editor's note asking engineering to confirm where production data lives. AI providers not named, AI training not addressed. No SOC 2 or ISO found.","sources":["https://www.bspk.com","https://www.bspk.com/privacy-policy","https://www.financialcontent.com/article/getnews-2026-9-2-bspk-the-best-clienteling-software-for-luxury-and-retail-goes-all-in-on-ai-and-customer-intelligence","Library test 46a7658019 (12 Oct 2026)"],"library_id":"46a7658019","lib_note":"Tested by us 12 Oct 2026 (product review)","section":"social","id":"bspk-luxury-clienteling-with-ai-agents"},{"name":"respond.io","url":"https://respond.io/pricing","category":"Messaging inbox and AI agents","what":"A shared inbox for WhatsApp, Instagram, Messenger and other chats, with AI that drafts replies and, on higher plans, AI agents that answer and route conversations.","for_you":"A controlled business inbox if DMs grow beyond what one phone can handle, with roles, rules and history. The catch: AI agents start at $159 a month, and Meta's WhatsApp fees come on top.","verdict":"Try for <X> only","verdict_detail":"only if the team handles many WhatsApp and Instagram DMs across several staff","safe_level":"amber","safe_line":"ISO 27001, but AI provider and training not published. Ask for DPA before real client chats.","effort":"30 min","price":"From $79/mo","plan_and_price":"Starter $79/month yearly ($99 monthly), 5 users, AI Assist, no agents. Growth $159 ($199), 10 users, AI agents. Advanced $279 ($349). Enterprise custom. Meta's WhatsApp fees extra. Checked 13 Oct 2026.","readings":[{"value":"ISO 27001","label":"certificate"},{"value":"$159/mo","label":"AI agents from"},{"value":"Not published","label":"AI provider"}],"try_before_friday":"Start a trial on a test number. Load a made-up FAQ (opening hours, delivery, gift cards) and see whether AI Assist drafts sensible replies in Russian and Azerbaijani.","good_for":["Several staff sharing one WhatsApp/Instagram inbox","Routing VIP chats to the right advisor"],"not_for":["Low message volume"],"better":"Chatwoot if IT wants the inbox on Italdizain's own server.","advice":"Compare it with Meta's free Business Agent: respond.io gives more control, roles and audit history, which matters for a luxury brand.","confidentiality":"States ISO 27001 and GDPR compliance; runs on AWS with AES-256 at rest and TLS in transit; users can delete their data. Security page names no AI providers and does not say whether chats train AI. Data region not stated.","sources":["https://respond.io/pricing","https://respond.io/security"],"library_id":"","section":"social","id":"respond-io"},{"name":"Modash (influencer discovery)","url":"https://modash.io/pricing","category":"Influencer discovery","what":"Searches a large database of Instagram, TikTok and YouTube creators by niche, audience location and fake-follower score, using plain-language AI search.","for_you":"Helps find real Baku and regional influencers for jewellery, watches and home décor, and spot fake followers. The catch: coverage of Azerbaijani creators is unverified.","verdict":"Try for <X> only","verdict_detail":"the 14-day free trial, to check how many genuine Azerbaijan-based creators it finds","safe_level":"green","safe_line":"Works on public creator data; only your search terms and shortlist are yours.","effort":"20 min","price":"From $199/mo","plan_and_price":"Essentials $199/month ($2,388 yearly). Performance $499/month. Enterprise from $14,700/year. 14-day free trial, no card. Checked 13 Oct 2026.","readings":[{"value":"14 days","label":"free trial, no card"},{"value":"ISO 27001 + GDPR","label":"badges on pricing page"},{"value":"Unverified","label":"Azerbaijan coverage"}],"try_before_friday":"Start the free trial. Search 'luxury lifestyle, audience in Azerbaijan, 10k–200k followers' and 'interior design Baku'. Record how many results are real local creators and how many have a high fake-follower score.","good_for":["Finding and vetting influencers","Spotting fake followers"],"not_for":["Running payments in Azerbaijan (not checked)"],"better":"HypeAuditor is similar (~$299–499/month per third-party sources; Azerbaijan coverage unknown).","advice":"Useful only if the creator database really covers Azerbaijan. The trial answers that in 20 minutes.","confidentiality":"Public creator data. The pricing page shows ISO 27001 and GDPR badges, links a DPA, and says accounts are deleted 90 days after cancellation. A third-party source says the company is Estonian (EU). ISO scope not checked.","sources":["https://modash.io/pricing"],"library_id":"","section":"social","id":"modash-influencer-discovery"},{"name":"Chatwoot (open-source shared inbox)","url":"https://www.chatwoot.com/pricing/","category":"Self-hosted chat inbox","what":"A free, open-source shared inbox for WhatsApp, Instagram, website chat and e-mail. It can run on Italdizain's own server, so the chats never leave it.","for_you":"The privacy-first option: client chats stay on a company server. The catch: IT has to install and run it, and the AI helper ('Captain') needs a paid edition.","verdict":"Try for <X> only","verdict_detail":"only if management wants all client chats kept on Italdizain's own server (needs IT)","safe_level":"green","safe_line":"Self-hosted: data stays on your server, no AI. Cloud edition is US-hosted.","effort":"Half a day for IT; 10 min to view the demo","price":"Free self-hosted","plan_and_price":"Self-hosted Community Edition free, no AI. Cloud per agent per month: Hacker $0, Startups $19 (300 AI credits), Business $39, Enterprise $99. Extra AI credits $20 per 1,000.","readings":[{"value":"37,735","label":"GitHub stars, MIT core (our test)"},{"value":"Free","label":"self-hosted, data stays in-house"},{"value":"~4 GB","label":"server space it needs"}],"try_before_friday":"Watch Chatwoot's public demo and list which of today's WhatsApp and Instagram chats the team would move into a shared inbox. No install needed for the meeting.","good_for":["Keeping client chats in-house","One inbox for several channels"],"not_for":["A team with no IT support"],"better":"respond.io if no one can run a server.","advice":"Our test: very active and MIT licensed, but needs a database, a queue and about 4 GB of server space. Plan a proper server before trying it.","confidentiality":"Self-hosted Community Edition: data stays on your server and there is no AI, the safest option for real client chats. Chatwoot Cloud runs on AWS in the USA and keeps data 1–3 years depending on plan. Captain AI reportedly uses OpenAI (third-party source); AI training and retention terms not published.","sources":["https://www.chatwoot.com/pricing/","https://github.com/chatwoot/chatwoot","https://www.eesel.ai/blog/chatwoot-pricing","Library test 4c0b8b77a9"],"library_id":"4c0b8b77a9","lib_note":"Tested by us (not installed: server disk full)","section":"social","id":"chatwoot-open-source-shared-inbox"},{"name":"n8n self-hosted automation (with n8n-MCP so Claude builds the workflows)","url":"https://n8n.io/pricing/","category":"Workflow automation","what":"A drag-and-drop automation builder with AI steps, run on our own server, so data from Instagram, forms or the website goes only where you decide. The n8n-MCP add-on gives Claude n8n's full manual so it can draft working workflows for you.","for_you":"The strongest answer to 'where does our data go?' for automations: new product, then draft post, then manager approval, then scheduled post. The catch: someone technical must set it up and look after it.","verdict":"Try for <X> only","verdict_detail":"one pilot automation, built with IT, on our own server","safe_level":"green","safe_line":"Self-hosted: workflows and logs stay on your server; data leaves only through the AI step you add.","effort":"2–3 hours with IT for the first workflow","price":"Free self-hosted","plan_and_price":"Community edition free (self-hosted). Cloud Starter €20/mo (2.5K runs), Pro €50/mo (10K runs), Business €667/mo self-hosted, Enterprise on request. n8n-MCP free (MIT); its hosted option is 100 tool calls/day.","readings":[{"value":"€0","label":"self-hosted community edition"},{"value":"2,951","label":"n8n building blocks n8n-MCP knows"},{"value":"Frankfurt","label":"where n8n Cloud stores data"}],"try_before_friday":"On paper: map one weekly routine (e.g. new arrivals, then caption drafts, then manager approval, then scheduled post) as boxes and arrows, written as 'when X happens, AI does Y, a person approves Z'. Mark which step would touch confidential data. Optionally browse n8n's template gallery for 2 similar workflows.","good_for":["New Instagram DM or website form, then an AI-drafted reply sent to a person for approval","Weekly ad and website numbers collected into one email","Monitoring public competitor pages"],"not_for":["Marketers building alone with no IT support","Posting to social media without human approval","Editing live production workflows with AI"],"better":"Zapier or Make if speed matters more than keeping data on our own server.","advice":"Huseyn already runs an automation server (hz-automation-1); a pilot could sit there, with approval steps before anything is published. n8n-MCP is untested by us: test only on copies.","confidentiality":"Self-hosted: workflows and logs stay on your server. Data leaves only through the AI step you add, under that provider's API terms (Anthropic and OpenAI APIs don't train on API data by default; a local model sends nothing out). n8n Cloud stores data in Frankfurt. The Sustainable Use License allows internal business use. A third-party directory lists SOC 2 Type II and ISO 27001 for n8n (unverified, may cover only the cloud). The hosted n8n-mcp option routes requests through n8n-mcp.com (terms unknown).","sources":["https://n8n.io/pricing/","https://docs.n8n.io/n8n-community-license/sustainable-use-license","https://trustlists.org/company/n8n/","https://github.com/czlonkowski/n8n-mcp","Library cdd67d7610 (n8n-MCP) and f37cf1f699 (n8n templates)"],"library_id":"cdd67d7610","lib_note":"In our library (not hands-on tested)","section":"auto","id":"n8n-self-hosted-automation-with-n8n-mcp-so-claude-builds-the"},{"name":"Zapier (Agents, AI steps, MCP) or Make","url":"https://zapier.com/pricing","category":"Cloud automation","what":"Ready-made cloud links between 7,000+ apps, with AI steps and agents. For example: a new website lead, then an AI summary, then a Teams message. No server needed.","for_you":"Marketers can build simple automations themselves in an afternoon. The catch: data passes through Zapier's US cloud, and only Enterprise customers are opted out of AI training automatically.","verdict":"Try for <X> only","verdict_detail":"automations that touch only public or non-sensitive data","safe_level":"amber","safe_line":"Data passes through a US cloud; non-Enterprise must opt out of training. No customer data.","effort":"30 min to start","price":"Free; Team $69/mo","plan_and_price":"Zapier: Free 100 tasks; Pro from $19.99/mo annual; Team from $69/mo annual (25 seats, SSO); Enterprise custom (page updated 12 Oct 2026). Make: Free 1,000 credits; paid tiers around $9–12/mo (sources conflict).","readings":[{"value":"$69/mo","label":"Zapier Team, 25 seats, annual"},{"value":"7 days","label":"shortest Zap history on Enterprise"},{"value":"eu1/eu2","label":"Make's EU hosting zones"}],"try_before_friday":"On Zapier's free plan, build a 2-step Zap: new item in a public RSS feed (e.g. a design magazine) leads to an AI step that drafts an Instagram caption and sends it to your email.","good_for":["New blog post, then AI-made social snippets as drafts","Collecting public review mentions into a sheet"],"not_for":["Customer lists, VIP client data or sales figures","Automatic posting without approval"],"better":"n8n self-hosted for anything with customer data. Power Automate for flows inside Microsoft 365.","advice":"If you use Make, check the dashboard URL says eu1 or eu2 before building anything; moving later means rebuilding.","confidentiality":"Zapier says Enterprise customers are automatically opted out of model training; others can opt out. Its AI subprocessors may not train on customer content, and it uses OpenAI's zero data retention. Enterprise can shorten Zap history to 7 days. Data residency not stated (treat as US). Make (Celonis): EU zones eu1/eu2, SOC 2 Type II and ISO 27001 stated, but the contract is with a US company and where its AI steps run is unclear.","sources":["https://zapier.com/pricing","https://zapier.com/legal/automation-platform-information","https://www.zapier.com/security-compliance","https://www.make.com/en/pricing","https://make.com/en/security","https://www.donneespersonnelles.fr/make-rgpd"],"library_id":"","section":"auto","id":"zapier-agents-ai-steps-mcp-or-make"},{"name":"Power Automate and Copilot Studio (Microsoft)","url":"https://www.microsoft.com/en-us/power-platform/products/power-automate/pricing","category":"Microsoft automation","what":"Microsoft's automation and agent builder. It connects Outlook, Teams, SharePoint and other apps, and Copilot Studio adds AI agents that can answer or act.","for_you":"Automations that stay inside the Microsoft contract, for example sorting brief requests into a Teams channel. The catch: confusing licences and credit costs, and weak social-media connectors.","verdict":"Worth a look later","verdict_detail":"","safe_level":"green","safe_line":"Runs in your Microsoft tenant under the Microsoft DPA; third-party agents follow their own terms.","effort":"1 hour","price":"From $15/user/mo","plan_and_price":"Power Automate Premium $15/user/month annual; Process $150/bot/month; Copilot Studio prepaid credits (about $0.008/credit pay-as-you-go per secondary source; official price not shown).","readings":[{"value":"$15","label":"Premium per user/month"},{"value":"$150","label":"unattended bot per month"},{"value":"Tenant","label":"data region follows your Microsoft 365"}],"try_before_friday":"Look at the templates in Power Automate (free with many M365 plans) and list 2 approval flows the team runs by email today.","good_for":["Routing requests and approvals in Teams","A simple Copilot agent that answers 'what are our brand rules?'"],"not_for":["Social media posting (weak connectors compared with Zapier/n8n)"],"better":"n8n or Zapier for social and ads apps.","advice":"Ask IT which Power Automate features your current M365 licences already include before buying anything.","confidentiality":"Runs in your Microsoft tenant under the Microsoft DPA. Copilot agents fall under enterprise data protection, but third-party agents follow their own terms (Microsoft Learn). Region follows your tenant.","sources":["https://www.microsoft.com/en-us/power-platform/products/power-automate/pricing","https://citizendevelopmentacademy.com/power-automate-pricing/","https://learn.microsoft.com/en-us/copilot/microsoft-365/enterprise-data-protection"],"library_id":"","section":"auto","id":"power-automate-and-copilot-studio-microsoft"},{"name":"Canva AI connector (in Claude and ChatGPT)","url":"https://www.canva.com/help/mcp-agent-setup/","category":"Design connector","what":"Lets Claude or ChatGPT open your Canva account to create, fill and resize designs from a chat, for example ten story sizes from one post.","for_you":"Turns a written campaign into first-draft visuals in Canva, where designers polish them. The catch: brand-kit support inside the chat is unclear (sources disagree).","verdict":"Try for <X> only","verdict_detail":"draft layouts and resizing of public campaign material","safe_level":"amber","safe_line":"Designs stay in Canva; what the AI sees follows your chat plan. Use a test folder first.","effort":"15 min to start","price":"Free connector","plan_and_price":"Connector itself free; needs a paid Claude plan (or ChatGPT) plus your Canva plan.","readings":[{"value":"2","label":"main chat apps supported (Claude, ChatGPT)"},{"value":"Unclear","label":"brand-kit use inside chat"},{"value":"Free","label":"connector itself"}],"try_before_friday":"Connect Canva in the Claude or ChatGPT test account. Ask for a 3-slide carousel for a fictional 'autumn tableware week' using only public product photos, then open it in Canva and judge how much fixing it needs.","good_for":["Resizing one post into story, reel cover and banner","First drafts of event invitations from public text"],"not_for":["Final brand-critical artwork without designer review"],"better":"Canva's own built-in AI if you only want quick edits inside Canva.","advice":"Use a test Canva folder first, and connect only a Canva Business/Teams account (where Canva says content never trains its AI).","confidentiality":"The chat assistant reads and writes the designs you allow; designs stay in Canva under Canva's terms. What the AI sees falls under your chat plan's terms. In Claude the connector needs a paid plan; in ChatGPT it sits under Settings > Apps. Do not put unreleased collection photos or price lists into designs made through the connector until settings are checked.","sources":["https://www.canva.dev/docs/connect/canva-mcp-server-setup","https://www.businesswire.com/news/home/20250626279168/en/Canva-Breaks-Ground-as-First-Design-Connector-for-OpenAIs-ChatGPT","https://www.krumzi.com/blog/design-in-chatgpt"],"library_id":"","section":"auto","id":"canva-ai-connector-in-claude-and-chatgpt"},{"name":"Business API with zero data retention (for automations)","url":"https://platform.claude.com/docs/en/manage-claude/api-and-data-retention","category":"Safe automation setup","what":"When AI is built into automations (feeds, reports, chatbots), the business API is not used for training, and the provider can agree to keep nothing at all. A gateway can also swap secrets for placeholders before they reach the AI.","for_you":"Matters once the team automates posting, reports or website chat: choose API terms before building. The catch: zero retention needs a sales agreement, and some top models require 30-day storage.","verdict":"Worth a look later","verdict_detail":"","safe_level":"amber","safe_line":"API data not trained on by default; kept 30 days unless zero retention is agreed.","effort":"1 hour with IT when automation starts","price":"Pay per use","plan_and_price":"Pay per use. Zero data retention available on request for eligible endpoints and features (OpenAI: contact sales; Anthropic: by agreement).","readings":[{"value":"30 days","label":"default API deletion (Anthropic; OpenAI abuse logs 30 days)"},{"value":"Sales only","label":"zero retention is agreed with the vendor"},{"value":"Not trained","label":"API data by default at OpenAI and Anthropic"}],"try_before_friday":"No hands-on exercise. Write down the 3 automations the team wants most (e.g. weekly Instagram report, product description generator, website chat) and mark the data each would touch as green, amber or red.","good_for":["Automated reports, website chat, content pipelines","Contracts with clear data terms"],"not_for":["Individual staff chatting (use the business chat plans)"],"better":"","advice":"Our library tested a gateway that swaps secrets for placeholders before they reach the AI (ThinkWatch Lite): it works, but only records by default. Plan the setup with IT.","confidentiality":"OpenAI: API data not trained on by default; abuse-monitoring logs kept 30 days; zero retention for eligible endpoints via sales. Anthropic: API inputs and outputs deleted within 30 days unless agreed otherwise; zero retention for qualifying features; some 'Covered Models' need 30-day retention (since June 2026 the top models must keep traffic 30 days even for business customers, per Reuters via resultsense). No customer personal data in automations without a legal check.","sources":["https://platform.claude.com/docs/en/manage-claude/api-and-data-retention","https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data","https://developers.openai.com/api/docs/guides/your-data/index.html","https://www.resultsense.com/news/2026-08-21-anthropic-enterprise-data-retention/","Library test 09b7d9e6fc (ThinkWatch Lite)"],"library_id":"09b7d9e6fc","lib_note":"Gateway tested by us","section":"auto","id":"business-api-with-zero-data-retention-for-automations"},{"name":"Microsoft Copilot Chat (work account, green shield)","url":"https://learn.microsoft.com/en-us/copilot/microsoft-365/enterprise-data-protection","category":"AI assistant you already own","what":"Microsoft's AI chat inside your existing Microsoft 365 work login. It drafts posts and texts in Azerbaijani, Russian and English, summarises documents you upload and creates images. The paid Business add-on also reads your mail, Teams and SharePoint.","for_you":"The safest place to start tomorrow, at no extra cost and with no new vendor: prompts fall under the Microsoft 365 contract you already have and are not used for training. The catch: Azerbaijani quality is unproven, images and brand control are basic.","verdict":"Try now","verdict_detail":"","safe_level":"green","safe_line":"Same contract as your Outlook mail; not used for training. Only with the work account and green shield.","effort":"15 min to start","price":"$0 extra","plan_and_price":"Copilot Chat: included with eligible Microsoft 365 business licences at no extra cost (agents billed by use). Copilot Business add-on: $18/user/month annual (promo 1 Jul–31 Dec 2026, first year; list $21), or $25.20 month-to-month, up to 300 users. Enterprise version about $30. Availability varies by market: check Azerbaijan with your Microsoft partner.","readings":[{"value":"$0 extra","label":"with your current Microsoft 365 licence"},{"value":"Not used","label":"for model training (work account)"},{"value":"18 Aug 2026","label":"date of Microsoft's data-protection page"}],"try_before_friday":"Open m365.cloud.microsoft/chat (or Copilot in Edge or Teams) with your WORK account and check the green 'protected' shield shows. Ask for 3 Instagram captions for a made-up 'autumn table setting' post, each in AZ, RU and EN, plus one matching image. A native speaker scores the Azerbaijani out of 5. Then sign in with a personal Microsoft account and see that the shield is gone.","good_for":["First drafts of captions and product texts in 3 languages","Summarising briefs and supplier PDFs you upload","Staff who are most nervous about confidentiality"],"not_for":["Final luxury product visuals","Customer personal data lists","Turning on the paid add-on before SharePoint permissions are cleaned up"],"better":"Claude Team or ChatGPT Business for stronger long-form writing and connecto
